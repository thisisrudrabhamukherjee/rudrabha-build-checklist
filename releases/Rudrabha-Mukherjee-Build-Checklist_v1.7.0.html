  ["Write what 'ready to show people' means specifically", "Which journeys must work, on which devices, with what reliability."],
  ["List everything you don't know yet, with a date to decide each", "Unanswered questions that sit around become bad decisions made in a hurry."],
  ["Write your budget: money and hours per week", "Both matter. A ten-hour-a-week project needs a smaller scope than a full-time one."],
  ["Note anything you must use or must avoid", "An existing system to connect to, a company policy, a language you already know."]
 ]},
 { n: "Have AI clean it up and then attack it", items: [
  ["Have the AI turn your notes into a clean specification", "The instruction not to invent things is essential. Without it you'll get requirements you never asked for.",
    { p: "Turn my notes below into a clear specification: the problem, who it's for, the main journeys as numbered steps, what's out of scope, and how we'll know it's done.\n\nUse only what I actually told you. Do not invent requirements. If you had to fill a gap, list those separately under 'Assumptions I made' so I can check each one.\n\nMy notes: [paste]" }],
  ["Read the assumptions list and correct every wrong one", "This is where the AI's guesses become your requirements if you don't catch them."],
  ["Have a fresh chat find the holes", "",
    { p: "Read this specification and tell me: what's ambiguous, what contradicts something else, what's impossible within my stated budget and deadline, and what the three hardest parts to build will be. Be specific about which sentence causes each problem.\n\n[paste specification]" }],
  ["Read it aloud to someone non-technical", "If they can't repeat back what it does, it isn't clear enough to build from."],
  ["Save the final version and note it as version one", "You'll update it. Keeping the original lets you see how far the idea moved."]
 ]}
]},

/* ================= 3 ================= */
{
id: "s3", name: "Decide how careful to be",
why: "A hobby project and a product handling money need the same steps at very different depths. Deciding now stops you both over-building and being careless.",
plain: "<b>In plain terms:</b> 'how careful' isn't about how good you are. It's about what happens when it breaks. Apology? Move fast. Someone's money or private information? Slow down at the specific points that matter.",
gate: "You can state in one sentence the worst realistic consequence of a bug, and you've set your targets.",
sections: [
 { n: "Work out the stakes", items: [
  ["Write down the worst thing a bug could realistically cause", "An apology, a refund, someone seeing another person's private data, someone being harmed. Your answer sets the depth of every check later."],
  ["Decide how bad it is if the product is down for a day", "Annoying, or does someone's business stop? This decides how much you spend on reliability."],
  ["Decide how bad it is if you lost all data from the last hour", "This sets how often you back up."],
  ["Decide how bad it is if data leaked publicly", "Be honest. Email addresses alone are a real incident if you have thousands.", { c: "personal" }],
  ["Write down who you'd have to tell if something went wrong", "Customers, a regulator, a business partner. Knowing now means you're not working it out during an incident.", { o: 1 }]
 ]},
 { n: "Personal information", items: [
  ["List every piece of information you'll store about a person", "Be specific and complete. Email, name, phone, address, payment details, photos, messages, location, health details.", { c: "personal" }],
  ["For each one, write why you need it", "Anything you can't justify, don't collect. Data you don't hold can't leak, can't be misused, and doesn't need protecting.", { c: "personal" }],
  ["Decide how long you keep each type, and what happens then", "'Forever' is a decision you should make deliberately, not by default.", { c: "personal" }],
  ["Decide how someone gets a copy of their data", "In many countries this is a legal right. Design the mechanism now; bolting it on later is painful.", { c: "personal" }],
  ["Decide how someone deletes their account and data", "Including what you must keep afterwards for legal or accounting reasons.", { c: "personal" }],
  ["Find out which privacy rules apply to you", "It depends on where your users are, not where you are.",
    { c: "personal", w: "This is a legal area and it varies by country. This checklist is not legal advice. If you're storing personal or health data at any scale, get proper advice once." }],
  ["Decide whether children could realistically use it", "If so, the rules are much stricter almost everywhere. Worth knowing before you design signup.", { c: "personal", o: 1 }]
 ]},
 { n: "Set your targets", items: [
  ["Write down how fast the main action must feel", "Under two seconds on a mid-range phone on mobile data. A number you can test."],
  ["Write down how many people might use it at the same time at peak", "A rough figure is fine. It stops you building for either ten or ten million by accident."],
  ["Write down your monthly cost ceiling", "And what you'd do if you hit it. Usage-based services can surprise you."],
  ["Write down how much data you can afford to lose and how fast you must recover", "Two numbers. They decide your backup approach entirely."],
  ["Write down which devices and browsers you support", "'Recent versions of the main browsers, plus phones from the last four years' is a reasonable starting answer."],
  ["Write down your accessibility target", "Decide now that the product must be usable with a keyboard and a screen reader. Retrofitting this is several times more expensive."]
 ]}
]},

/* ================= 4 ================= */
{
id: "s4", name: "Choose your tools",
why: "AI is far better at popular, mature technology than at whatever launched last month. Your tool choices directly determine how much the AI gets wrong.",
plain: "<b>In plain terms:</b> the AI learned from code that already exists. So it's excellent at the boring popular stuff and shaky at the exciting new stuff. Choosing the slightly unfashionable option means fewer mistakes and less time fixing them. This feels wrong. It is right.",
gate: "Every choice below is made and written down with a sentence of reasoning.",
sections: [
 { n: "Compare properly before choosing", items: [
  ["Ask for three options, not one", "'What should I use' gets one confident answer with its reasoning hidden. The last line of this prompt is the important one.",
    { p: "Here's what I'm building: [paste your specification]\nMy situation: [skill level, budget, deadline, anything you must or can't use]\n\nGive me three options: the simplest, the one you'd pick, and the one that handles the most growth.\n\nFor each: what it is in plain English, roughly what it costs at 100 users and at 100,000, the biggest risk, and what would be hardest to change later.\n\nThen recommend one — and tell me exactly what fact about my situation would change your recommendation." }],
  ["Ask how old and how widely used each option is", "Anything under a couple of years old means you'll be correcting the AI's mistakes about it constantly."],
  ["Ask what would be hardest to move away from later", "Some choices are easy to reverse. Some aren't. Know which is which before committing."],
  ["Check you can find plenty of help online for it", "Search for a beginner problem in it. If almost nothing comes up, neither the AI nor you will have support."],
  ["Prefer the option you could hire help for", "One day you may need a human. Popular technology means that person exists and is affordable.", { o: 1 }]
 ]},
 { n: "Make the core choices", items: [
  ["Choose one thing to build, not many pieces", "One connected application, unless you have a specific present reason otherwise. Splitting things up early is a reliable way for small projects to stall."],
  ["Choose the programming language and framework", "One you could get help with. Write down the exact version."],
  ["Choose how information is stored", "A traditional relational database is the right default. Choose otherwise only for a specific reason you can explain."],
  ["Choose where it runs", "A managed hosting service that handles servers for you. Running your own servers is a second job."],
  ["Decide how pages are delivered", "Pages built on the server are better for anything people find through search; app-style delivery suits things people log into and use for a while.", { o: 1 }],
  ["Decide whether you need background jobs", "Anything slow — sending emails, processing files, generating reports — shouldn't happen while someone waits. Adding this later is expensive."]
 ]},
 { n: "Buy these rather than build them", items: [
  ["Use an established login service instead of building your own", "Login is the most common place AI-built projects have serious holes. It looks simple and isn't.",
    { w: "If you take one instruction from this entire checklist, take this one." }],
  ["Use an established payment company and never store card numbers", "They handle the hard and legal parts. Your job is recording what the customer is entitled to, in your own database.", { c: "money" }],
  ["Use a transactional email service", "Email sent from your own server mostly lands in spam. Deliverability isn't a problem to solve yourself."],
  ["Use a file storage service for uploads", "Don't store uploaded files alongside your code. Storage services handle size, delivery speed and access control.", { c: "files" }],
  ["Choose an error-reporting service", "Something that messages you when the product breaks for someone. Without it you learn from an angry customer, or never."],
  ["Choose an analytics tool", "So you can see where people stop. Pick a privacy-respecting one if you can.", { o: 1 }],
  ["Choose a text-message or notification service only if you truly need it", "Each service is another account, cost and failure point. Add it when there's a real need.", { o: 1 }]
 ]},
 { n: "Set up accounts and record decisions", items: [
  ["Create the accounts you need and turn on two-factor authentication on each", "Your hosting, code and payment accounts are the keys to everything. Protect them first."],
  ["Use a password manager for all of it", "You'll accumulate a dozen accounts. Reusing passwords across them is how projects get taken over."],
  ["Note the free-tier limits of every service", "And what happens when you exceed them — does it stop, or does it charge you?"],
  ["Add up the monthly cost at your expected size", "Including the AI tools themselves. Compare it with the ceiling you set in stage three."],
  ["Write down every choice with a sentence of reasoning", "What you chose, what else you considered, why. Paste this into future AI sessions and it stops suggesting things you already ruled out."],
  ["Write down the exact version numbers you're using", "The AI often produces code for an older version. Telling it your versions every time prevents a whole category of confusing error."]
 ]}
]},

/* ================= 5 ================= */
{
id: "s5", name: "Design where information lives",
why: "How your information is organised is the hardest thing to change once real people's data is in there.",
plain: "<b>In plain terms:</b> this is the filing cabinet. Once a thousand real customers' folders are in it, rearranging the drawers is genuinely hard. Spend an afternoon now rather than a fortnight later.",
gate: "The AI has attacked your design and you've fixed or consciously accepted everything it found.",
sections: [
 { n: "List what you keep track of", items: [
  ["List the things your product stores", "Users, orders, messages, photos — the nouns from your description."],
  ["Write down how they connect", "One user has many orders. One order has many items. Each project belongs to one company."],
  ["For each thing, list the details you store about it", "And which are required versus optional."],
  ["List every question the product must answer", "Show this user's orders from last month, newest first. Do this before designing the structure, so the structure serves the questions."],
  ["Mark which questions happen constantly and which are rare", "The constant ones are what you design around."]
 ]},
 { n: "Get the rules right", items: [
  ["Make the database itself enforce the rules, not just the code", "If an order must belong to a real customer, the database should refuse to store one that doesn't. Code-only checks get bypassed."],
  ["Make uniqueness a database rule", "One account per email address, enforced by the database. Checking in code alone fails when two people sign up at the same instant."],
  ["Store money as whole small units, never as decimal numbers", "Paise or cents, as whole numbers. Ordinary decimals lose fractions and your totals slowly stop matching.", { c: "money" }],
  ["Store all times in one standard timezone and convert only when displaying", "Mixing timezones in storage produces bugs that appear only at certain hours and are miserable to find."],
  ["Add created-at and updated-at to everything", "Costs nothing now. You will want them for every support question you're ever asked."],
  ["Decide what can never be edited or deleted", "Payment records, audit trails, anything with legal meaning. These should only ever be added to."],
  ["Decide whether deleting really deletes, or just hides", "Both are valid. Choosing by accident is not.", { o: 1 }]
 ]},
 { n: "Keeping customers separate", items: [
  ["Decide how one company's data is kept from another's", "Ask for it to be structurally impossible rather than something the code remembers to do.",
    { c: "teams", w: "One customer seeing another's data is the failure that ends businesses. It isn't a bug you apologise for." }],
  ["Make sure every stored thing knows which company it belongs to", "And that the check is applied automatically, not written by hand in each place.", { c: "teams" }],
  ["Plan what happens when someone joins or leaves a company", "Who can see what they made? What happens to their work?", { c: "teams" }],
  ["Decide what roles exist and what each can do", "Owner, admin, member, viewer. Write the grid before building it.", { c: "teams" }],
  ["Plan for a customer wanting all their data exported or deleted", "It'll be asked for. Knowing it's possible shapes the design.", { c: "teams", o: 1 }]
 ]},
 { n: "Stress-test and lock it in", items: [
  ["Have the AI stress-test the design", "Question five is the important one if multiple customers share the system.",
    { p: "Here's how I'm planning to store my information, and the questions the product needs to answer: [paste]\n\n1. For each question, will this be fast, or will it get slow as data grows?\n2. What breaks when there's 100 times more data than today?\n3. Where could two things happening at the same time leave data in a broken state?\n4. What would be painful to change later, once real data exists?\n5. If different customers share this system: name every place one customer could see another's data, and tell me how to make that impossible rather than just unlikely." }],
  ["Fix everything it found, or write down why you're accepting it", "An accepted risk you wrote down is fine. An unnoticed one isn't."],
  ["Make every change to the structure a recorded, reversible step", "Ask for versioned migrations. Never change the live structure by hand — including you, including just this once."],
  ["Check that speed comes from deliberate choices", "Ask which questions would be slow and what makes them fast. Adding speed-ups everywhere by default causes its own problems."],
  ["Write the structure down in plain English", "One paragraph per thing you store. You'll paste this into AI sessions constantly."],
  ["Freeze it before building features", "Changes after this point cost real time. Not impossible — just no longer free."]
 ]}
]},

/* ================= 6 ================= */
{
id: "s6", name: "Set up your workshop",
why: "This is the safety equipment — the machines that catch the AI's mistakes automatically before they reach anyone.",
plain: "<b>In plain terms:</b> this is the part beginners skip and professionals never do. It's also the main reason professional work looks professional. Not smarter people — the net is there.",
gate: "An empty, boring version of your product is live on a test address and the automatic checks pass.",
sections: [
 { n: "Version control", items: [
  ["Put the project in version control on day one", "The undo button for the whole project. Ask the AI to set it up and explain each step."],
  ["Make the first commit before writing any real code", "So there's always something to go back to."],
  ["Add the ignore file before committing anything", "This stops passwords, keys and junk files being committed. Ask the AI for the right one for your setup."],
  ["Protect the main copy so changes get reviewed", "Even alone. It forces a pause before anything reaches the important branch."],
  ["Learn the four commands you actually need", "Save a change, undo a change, look at history, go back. That's genuinely enough to start.", { o: 1 }],
  ["Put the project somewhere backed up, not only your laptop", "A hosted code service. Laptops get stolen, dropped and stop working."]
 ]},
 { n: "Three separate copies", items: [
  ["Set up your own copy on your machine", "Where you work. Broken here affects nobody."],
  ["Set up a test copy that looks like the real thing", "Same setup, separate data. This is where you try things before real people see them."],
  ["Set up the real one", "What actual people use."],
  ["Use completely separate data for each", "Never test with real customers' data.",
    { w: "Using real data for testing is how test emails get sent to real customers, and how real records get deleted by a test." }],
  ["Make sure each copy gets its settings from the environment, not the code", "So the same code runs everywhere, with different addresses and keys."],
  ["Make some obviously fake sample data for testing", "So you can develop without ever touching real records."]
 ]},
 { n: "Turn on the automatic checkers", items: [
  ["Set up the formatter and the style checker", "Removes an entire category of pointless disagreement and keeps AI output consistent.",
    { p: "Set up automatic quality checks for my project and explain what each one does in plain English:\n\n- code formatter and style checker\n- the strictest type checking this language supports\n- a scan that fails if a password, key or secret appears in the code\n- a check for known security problems in the libraries I use\n\nMake all of them run automatically on every change, and make a failure block the change from being accepted. Show me how to run each one myself too." }],
  ["Turn on the strictest type checking available", "Disproportionately valuable with AI, because it mechanically catches a large share of what AI gets wrong."],
  ["Turn on secret scanning", "So a key accidentally written into the code stops the build instead of reaching the internet."],
  ["Turn on the security scan for the libraries you use", "Known problems in things you didn't write are a real and common risk."],
  ["Make all of these run automatically on every change", "A check you have to remember to run is a check that doesn't happen."],
  ["Make a failed check block the change", "If it's allowed to be ignored, it isn't a check."]
 ]},
 { n: "Passwords, keys and secrets", items: [
  ["Keep every key and password out of the code", "They go in a separate settings place. Ask the AI to show you the right one for your setup."],
  ["Write down every key you have and what it unlocks", "You'll accumulate a dozen. Knowing what each one opens matters on the day one leaks."],
  ["Use different keys for test and real", "So a test mistake can't touch real money or real customers."],
  ["Learn how to replace a key", "Do it once now while nothing is wrong.",
    { w: "Deleting a key from your code does not remove it from the project's history. It has to be replaced." }],
  ["Check that keys used in the browser are meant to be public", "Some are; most aren't. Anything sent to a browser can be read by anyone.", { o: 1 }]
 ]},
 { n: "Teach the AI your project", items: [
  ["Write the project rules file", "One file in the project that the AI reads every session. The highest-value habit here — it turns the AI from a stranger into a colleague.",
    { p: "Create a project rules file for my AI assistant to read at the start of every session. Include:\n\n- what this product is, in two sentences\n- the exact tools and versions we're using\n- where different kinds of files live\n- our naming and error-handling conventions\n- the commands to install, run, test and publish\n- things that must never be done in this project, and why\n\nKeep it short enough that it actually gets read. I'll add to it as we go." }],
  ["Put your specification and your decisions where the AI can read them", "So it stops proposing things you already ruled out."],
  ["Add your exact version numbers to the rules file", "The most effective single line for preventing outdated code."],
  ["Write down what the AI may do without asking", "Good default: edit code and run tests freely; ask before installing anything; never touch the live system, the data structure, or anything with keys."],
  ["Add to the rules file every time you correct the same thing twice", "If you've said it twice, it belongs in the file rather than in your memory."],
  ["Note the deliberate shortcuts you've taken", "Things you know aren't ideal but chose anyway. Stops the AI 'fixing' them and stops you forgetting them.", { o: 1 }]
 ]},
 { n: "Get something live early", items: [
  ["Publish an empty version to the test address", "One boring page. Publishing problems found now cost an hour; found a week before launch they take over your life."],
  ["Check the automatic checks run when you publish", "The whole point is that they run without you."],
  ["Set up a proper web address", "Even a temporary one. It makes the project real and catches address-related problems early.", { o: 1 }],
  ["Confirm the secure padlock works", "Almost automatic on modern hosting, but confirm rather than assume."],
  ["Write down the exact steps to publish", "Even if it's one command. You'll do this hundreds of times and you don't want to think about it."]
 ]}
]},

/* ================= 7 ================= */
{
id: "s7", name: "Build one piece at a time",
why: "One complete feature, finished, before starting the next. This is the difference between steady progress and a pile of half-working parts.",
plain: "<b>In plain terms:</b> asking for the whole thing at once gets you forty files, one of which is broken, with no way to tell which. Ask for one complete thing — from the button a person clicks to where the information is saved — and finish it.",
gate: "Repeat this loop per feature. Move on when every journey in your specification works end to end.",
sections: [
 { n: "Before each piece", items: [
  ["Pick one thing a person can do", "'Someone can sign up.' 'Someone can add a photo.' Small enough to finish in a day or two."],
  ["Write down what goes in, what comes out, and who's allowed", "Five lines. This becomes both the instruction and the test."],
  ["Write down what should happen when it goes wrong", "Before building the working version. Otherwise it never gets built at all."],
  ["Start a fresh AI conversation", "New feature, new chat. Your rules file carries the memory instead."],
  ["Make the AI show its plan before writing code", "Which files it will touch and what goes in each. Read it. Correct it. Two minutes here saves an hour.",
    { p: "Build only this one thing: [describe it].\n\nWhat goes in: [...]\nWhat comes out: [...]\nWhat should happen when it goes wrong: [...]\nWho's allowed to do it: [...]\nIt's done when: [...]\n\nFirst, list the files you'll create or change and what each will contain. Stop there and wait for me to approve before writing any code.\n\nFollow my project rules file. Use only the versions listed there. Don't touch anything outside this one feature. Don't add any new library without telling me why and waiting." }]
 ]},
 { n: "A sensible order to build in", items: [
  ["Build sign-up and sign-in first", "Almost everything else depends on knowing who someone is.", { c: "signup" }],
  ["Build the single most important thing your product does, next", "Creating, viewing, editing and deleting the one central thing."],
  ["Build the main journey end to end, however ugly", "Working and plain beats beautiful and half-connected. Appearance comes in stage ten."],
  ["Build the hardest unknown thing early, not last", "It's the thing most likely to change your plan. Find out now."],
  ["Build payments and subscription handling next", "It touches everything and has the least tolerance for mistakes.", { c: "money" }],
  ["Then the secondary journeys", "Settings, editing profiles, inviting people, admin screens."],
  ["Leave nice-to-haves until everything essential works", "They are how projects run out of time at ninety per cent complete."]
 ]},
 { n: "While the AI is working", items: [
  ["Ask for small pieces, not whole features in one go", "Data first, then the logic, then the screen. Three small correct steps beat one large uncertain one."],
  ["Read what it wrote, even if you don't understand all of it", "You're looking for things that feel wrong. Asking 'what does this line do and what happens if it fails' is completely reasonable."],
  ["Ask it to explain anything you don't recognise", "If it can't explain it simply, that's a signal worth paying attention to."],
  ["Stop it if it starts changing files you didn't mention", "Sprawl is how a small change becomes a broken afternoon."],
  ["Don't let it add libraries without asking", "Each one is a permanent dependency, a security surface and a thing to update forever."],
  ["Start a new chat when it starts making mistakes it wasn't making an hour ago", "Long conversations degrade. Correcting it repeatedly in a bad session rarely recovers."]
 ]},
 { n: "Checking the AI's work", items: [
  ["Run it and use it yourself", "Every time. Not just read the code."],
  ["Try to break it deliberately", "Empty boxes. Very long text. Wrong information. Double-click submit. Close the tab halfway. Press back."],
  ["Check that it does something sensible when things fail", "Turn off your internet mid-action and see what happens."],
  ["Check nothing private is visible in the browser", "Ask the AI to confirm no keys or other people's data reach the browser."],
  ["Get a second opinion from a fresh chat", "The last sentence stops it inventing trivia to look useful.",
    { p: "Review this code as a strict senior engineer whose job is to find reasons it should not be accepted.\n\nList problems worst-first: security holes, things that are simply wrong, what happens when something fails, what breaks when many people use it at once.\n\nFor each: which line, why it's wrong, what it would do to real users, and the smallest fix. If you find nothing serious, say so plainly rather than inventing small issues." }],
  ["Check it didn't quietly break something else", "Run everything else you've built. This is exactly what the tests in the next stage are for."]
 ]},
 { n: "After each piece", items: [
  ["Save your work with a note explaining why", "Future you reads these. 'Fixed stuff' helps nobody."],
  ["Update the project rules file if a new convention appeared", "The moment it happens, not later."],
  ["Tick the feature off your specification", "Visible progress matters more than you'd think over a long build."],
  ["Ask for a handover summary before closing the chat", "",
    { p: "Summarise this session for my project rules file: what we decided and why, any new conventions, anything we deliberately left for later, and the exact next step. Write it so a fresh assistant with no memory of this conversation could pick up from it." }],
  ["Publish to the test copy and check it still works there", "Works-on-my-machine is the oldest problem in software."]
 ]}
]},

/* ================= 8 ================= */
{
id: "s8", name: "Check that it actually works",
why: "Tests are what let you change things later without fear. Without them, every change is a gamble.",
plain: "<b>In plain terms:</b> a test is a small piece of code that uses your product like a person would and complains if the answer is wrong. Their value isn't today — it's in six months, when you change something and instantly find out whether you broke anything.",
gate: "Your main journeys are covered by tests that run automatically, and they pass.",
sections: [
 { n: "Getting tests written", items: [
  ["Tell the AI which situations to test — don't let it choose", "Left alone it writes tests that check what the code currently does, which always pass and catch nothing.",
    { p: "Write tests for this, based on how it's supposed to behave — not on how the code currently behaves. If the code disagrees with the description, the test should fail and you should tell me.\n\nTest exactly these situations: [list them yourself]\n\nDon't write any test that can't fail. For each one, tell me in a single line what problem it would catch." }],
  ["Make the tests run automatically on every change", "A test suite you have to remember to run stops being run within two weeks."],
  ["Check that the tests can actually fail", "Deliberately break something and confirm a test goes red. Tests that pass no matter what are worse than none."],
  ["Use a separate test database that resets itself", "Tests that leave mess behind start failing for reasons unconnected to your code."],
  ["Keep them fast enough that you'll actually run them", "If the suite takes ten minutes, you'll stop running it.", { o: 1 }]
 ]},
 { n: "What to test, in priority order", items: [
  ["Test each main journey from start to finish", "The numbered steps from stage two. If you only ever have one set of tests, have this one."],
  ["Test that people can't reach what isn't theirs", "For everything private: the owner can, someone else can't, a logged-out stranger can't.",
    { w: "A hidden button is not security. Someone who knows how can ask your system directly. The check must happen on the server, every time." }],
  ["Test that one customer cannot reach another's data", "Write a test that deliberately tries and expects to be refused. The most important test you will ever write.", { c: "teams" }],
  ["Test empty, huge and wrong input on every form", "Nothing entered, a novel pasted in, letters where numbers go, dangerous-looking text."],
  ["Test that doing something twice doesn't happen twice", "Double-clicking pay, submitting twice, a payment notification arriving again.", { c: "money" }],
  ["Test the money rules specifically", "Discounts, refunds, tax, part-months, failed payments, cancellation.", { c: "money" }],
  ["Test that expired sessions and logins behave properly", "People leave tabs open for weeks.", { c: "signup" }],
  ["Test the file upload limits", "Wrong type, far too large, a file with a strange name, and nothing selected at all.", { c: "files" }]
 ]},
 { n: "Testing by hand", items: [
  ["Walk through every journey yourself before showing anyone", "Slowly, as if you'd never seen it."],
  ["Watch a real person use it, saying nothing", "Every instinct will tell you to explain. Don't. Where they hesitate is where your product is confusing, and no test reveals that."],
  ["Try it on a real phone, not a shrunken browser window", "Thumb-sized buttons, nothing cut off, no sideways scrolling."],
  ["Try it on a slow connection", "Most browsers can pretend to be slow. Ask the AI how."],
  ["Try it on the main browsers", "The big ones at minimum. Differences are fewer than they were, but they exist.", { o: 1 }],
  ["Try it with the text size turned up", "Plenty of people run large text. Layouts often fall apart.", { o: 1 }],
  ["Try the whole journey using only the keyboard", "Tab and Enter, start to finish."]
 ]},
 { n: "Bug discipline", items: [
  ["Write every bug down when you find it", "Rather than fixing whatever's newest. A list stops you going in circles."],
  ["Add a test for each bug before you fix it", "So it can never come back silently. A large part of why professional software stays stable."],
  ["Note what caused each bug", "After ten, you'll see a pattern — and the pattern is usually fixable at the source."],
  ["Fix causes, not symptoms", "If the same kind of bug keeps appearing, something structural is producing it."],
  ["Keep a list of known issues you've decided to live with", "A known accepted problem is fine. An unnoticed one isn't.", { o: 1 }]
 ]}
]},

/* ================= 9 ================= */
{
id: "s9", name: "Lock the doors",
why: "Security has to be its own deliberate pass. It never happens by accident, and the AI will not do it unless asked directly.",
plain: "<b>In plain terms:</b> the AI writes code that works. Working and safe are different, and it doesn't reliably do the second unless you make it. This is a scheduled check, not something you hope happened along the way.",
gate: "You've run the whole checklist and the hostile review, and fixed or consciously accepted every finding.",
sections: [
 { n: "Accounts and logging in", items: [
  ["Confirm passwords are stored scrambled, not readable", "Ask the AI directly which method it used and whether it's a current recommended one.", { c: "signup" }],
  ["Make sure password reset can't reveal who has an account", "'If that email exists, we've sent a link' rather than 'no such user'.", { c: "signup" }],
  ["Make sure reset links expire and work only once", "", { c: "signup" }],
  ["Make sure logging out actually ends the session everywhere", "", { c: "signup" }],
  ["Offer two-factor authentication if you hold anything valuable", "", { c: "signup", o: 1 }],
  ["Give your admin accounts stronger protection than ordinary ones", "Two-factor authentication compulsory, and an alert to you when an admin signs in from somewhere new. Admin accounts are the keys to everything.", { c: "signup" }],
  ["Check that email verification can't be skipped", "", { c: "signup", o: 1 }]
 ]},
 { n: "Permissions", items: [
  ["Check permission on the server for every single action", "Not just 'are you logged in' but 'is this actually yours'. The most common serious hole in AI-built software, because the demo works either way."],
  ["Go through every single screen and action and write down who may use it", "Then verify each one. Tedious and there is no substitute."],
  ["Try changing a number in the address bar to someone else's", "If you see their data, you've found the most common serious bug in existence."],
  ["Make sure hidden buttons are backed by real checks", "Hiding a button hides it from polite people only."],
  ["Check admin screens are actually protected", "'Nobody knows the address' is not protection."],
  ["Check that the permission check can't be forgotten in new code", "Ask for it to be applied automatically rather than written by hand each time.", { c: "teams" }]
 ]},
 { n: "What comes in and goes out", items: [
  ["Check every input is validated on the server", "Browser checks are for helpfulness. Server checks are for safety. You need both."],
  ["Ask the AI to confirm database instructions are built safely", "The phrase to use is 'parameterised queries'. Building them by joining text together is the oldest serious flaw there is."],
  ["Check that text someone types can't run as code when displayed", "Someone else's name should never be able to affect your page."],
  ["Ask the AI to confirm protection against forged form submissions", "The technical name is CSRF. Without it, another website can silently submit your forms on behalf of a signed-in user. Most frameworks include it — confirm yours is actually turned on.", { c: "signup" }],
  ["Set a maximum size on everything people can submit", "Text, files, number of items. Without limits, one person can exhaust your server."],
  ["Check uploaded files are validated by content, not just name", "And that they're stored where they can never be executed.", { c: "files" }],
  ["Serve uploaded files from a separate address if you can", "Stops an uploaded file from being treated as part of your site.", { c: "files", o: 1 }]
 ]},
 { n: "Keys, libraries and supply", items: [
  ["Confirm no keys or passwords are in the code", "Run the scanner; don't rely on memory."],
  ["Check every library the AI suggested actually exists", "AI sometimes invents names. Attackers register the invented names and wait.",
    { w: "Never install something just because an AI named it. Look it up: does it exist, is it maintained, is it the one you meant? This attack is real and actively used." }],
  ["Check each library is maintained and widely used", "An abandoned library is an unpatched problem waiting."],
  ["Commit the lock file that pins exact versions", "So everyone and every deployment gets identical code."],
  ["Turn on automatic alerts for vulnerable libraries", "Most code hosts offer this free."],
  ["Remove libraries you're no longer using", "Each one is a surface you don't need.", { o: 1 }],
  ["Avoid loading scripts from other people's servers", "Any script loaded from elsewhere can read everything on your page, including what users type. Add each one deliberately, know why it's there, and prefer hosting copies yourself."],
  ["Set a reminder to replace your keys on a schedule", "Every few months, and immediately when anyone with access leaves. A key that never changes is a key that eventually leaks.", { o: 1 }]
 ]},
 { n: "Abuse, limits and money", items: [
  ["Limit how often someone can try to log in", "Otherwise one person can guess passwords all night, or lock out your users.", { c: "signup" }],
  ["Limit anything that costs you money per use", "Emails, messages, AI calls, file processing. A loop left running overnight is an expensive lesson."],
  ["Limit how often forms can be submitted", "Contact forms without limits become spam relays within days.", { c: "public" }],
  ["Add bot protection on public forms", "Signup and contact especially.", { c: "public", o: 1 }],
  ["Verify payment notifications really came from the payment company", "Ask the AI to confirm signature verification is implemented. Without it, anyone can tell your system a payment succeeded.",
    { c: "money", w: "This is a specific, common and expensive mistake in AI-built payment code." }],
  ["Make payment actions safe to repeat", "Notifications arrive twice more often than you'd expect. Charging twice is unforgivable.", { c: "money" }],
  ["Set a spending alert on every usage-based service", "Including your own AI usage."]
 ]},
 { n: "Errors, logs and review", items: [
  ["Make sure users never see technical error details", "'Something went wrong, please try again' for them; the details go to you."],
  ["Check that nothing private ends up in your logs", "Passwords, payment details, personal information. Logs get copied and read by tools.", { c: "personal" }],
  ["Make sure the secure padlock is enforced everywhere", "Including redirecting anyone who arrives insecurely."],
  ["Ask the AI to add standard browser security settings", "A short list of headers that prevents several whole categories of attack."],
  ["Run a hostile review", "Asking 'is this secure' gets reassurance. Ask this way instead.",
    { p: "You are a security tester hired to break into this application. You're paid only for what you find.\n\nGiven this code and data structure, list concrete attacks. For each: exactly what you'd send, what you'd need first, what damage it does, and the smallest fix.\n\nPay special attention to whether someone can reach data that isn't theirs, and to anything that spends money or sends messages on a user's behalf.\n\nWorst first. Don't list anything you can't justify." }],
  ["Fix everything found, or write down why you accepted it", ""],
  ["Write your ten-minute plan for a data leak", "Who you tell, what you switch off, which keys you replace, how you find out what was reached. Written now, calmly — not invented during the emergency. In many countries you have a legal duty to notify people.", { c: "personal" }],
  ["Give people a way to report a security problem to you", "A simple line on your site: found a security issue? Write to this address. Researchers find things; make it easy for them to tell you instead of someone else.", { c: "public", o: 1 }],
  ["Get a professional review before taking real money or sensitive data", "An AI review is a useful extra layer, not a substitute. Pay a specialist once.", { c: "money", o: 1 }]
 ]}
]},

/* ================= 10 ================= */
{
id: "s10", name: "Make it feel professional",
why: "This is what separates work that looks like a real product from work that looks like a first attempt. Almost all of it is small, specific and fixable.",
plain: "<b>In plain terms:</b> people judge in seconds, on details you can completely control. None of this needs design talent. It needs going through a list.",
gate: "Every item here is either done or a deliberate decision you've written down.",
sections: [
 { n: "Decide how it should look before any screen exists", items: [
  ["Collect three products you think look professional, in any industry", "Not competitors — anything you admire. You are studying decisions, not copying a look."],
  ["For each one, write down what it does at six specific moments", "Signing up. The screen before there is any content. An error. Confirming something that cannot be undone. Waiting. Navigating on a phone. Three sentences each. These six moments are where perceived quality actually lives.",
    { p: "I am studying how good products handle specific moments, so I can design mine deliberately.\n\nFor the product I describe below, explain how it handles: signing up, the screen before a user has any content, an error, confirming something irreversible, waiting for something slow, and navigating on a phone.\n\nFor each moment tell me: what it does, WHY that works, what it costs, and when it would be the wrong choice. Focus on the decision and the reasoning, not on how it looks. Do not tell me to copy its colours, fonts, icons or wording.\n\nThe product: [describe it, or paste what you see on the screen]" }],
  ["Keep those notes in a file next to your written description", "Organised by moment, not by product — all six signup approaches together, all six empty screens together. The pattern that appears across unrelated industries is a real principle. The one that only appears within your industry is often just what everyone copied from whoever was first."],
  ["Write a one-paragraph description of how yours should feel", "Calm and dense like a professional tool, or spacious and friendly like a consumer app? Serious or warm? One paragraph. Without it the AI will pick for you, and it will pick the average.",
    { w: "This is the step that prevents the AI look. A design with no stated direction comes out as the average of everything the AI has seen, and the average of all web design is mediocre." }],
  ["Tell the AI plainly which clichés to avoid", "Left alone it reaches for the same handful of decorations, and they are recognisable as AI work.",
    { p: "Design direction for my product: [paste your paragraph].\n\nDo not use any of the following unless I specifically ask: purple or blue gradient backgrounds, gradient text, frosted glass effects, emoji used as icons, sparkle symbols, a drop shadow on every element, large rounded corners on everything, neon accent colours, or a centred hero followed by a three-column grid of circular icons.\n\nCreate hierarchy with size, weight and space instead of decoration. Choose ONE element to be visually bold and keep everything else quiet. Then tell me which single element you chose and why." }],
  ["Match the density to what it is", "A tool people use all day should be tighter and more information-dense than a page people visit once. The AI defaults to airy marketing spacing for everything.", { o: 1 }]
 ]},
 { n: "Build the parts once, then reuse them", items: [
  ["Have the AI define the shared pieces before it builds any screen", "One button, one input, one card, one list row — defined once and used everywhere. Without this, every screen invents its own, which is exactly why buttons end up different shapes and sizes across a product.",
    { p: "Before building any screen, define one shared component each for: button (with its normal, pressed, disabled and loading states), text input with label and error, card, and list row.\n\nRules that apply to all of them:\n- min-height, never a fixed height; size by padding so they grow with their content\n- no fixed pixel widths on anything that contains text\n- all sizes in rem, so they scale if someone enlarges their text\n- one spacing scale, one corner radius, one shadow style, used everywhere\n\nEvery screen after this must use these components and must not invent its own. Tell me if a screen ever needs something they cannot do." }],
  ["Check that every button in the product is the same height", "Look at a row of them. Different heights means they were each built separately, and that inconsistency is the fastest way to look amateur."],
  ["Make sure nothing that holds text has a fixed height", "A fixed height fits today's short label. A longer label, a bigger font, or another language pushes the text outside its own box.",
    { w: "Text escaping its button or box is almost always a fixed height where it should have been a minimum height. Ask the AI to check for this specifically." }],
  ["Make rows of buttons wrap instead of overflowing", "When three buttons no longer fit side by side they should stack, not run off the edge or get squashed."],
  ["Ban silent trimming of text", "Cutting a label off with dots hides information the person needed, and on a phone there is no way to reveal it. Let it wrap. Only trim when you deliberately choose to, and make the full text reachable.",
    { w: "Truncated options are a real accessibility failure, not a cosmetic one. If a user cannot read their own choices, the screen is broken." }],
  ["Ask for the rule that stops long words breaking the layout", "A long unbroken word or address will push its container wider than the screen unless the layout is told to allow shrinking. This is the most common single cause of a page scrolling sideways."]
 ]},
 { n: "Build against real content, not samples", items: [
  ["Replace every placeholder with your longest realistic content", "The longest name, the longest error message, the biggest number, the longest email address. The AI designs for three tidy sample rows; real content is not tidy."],
  ["Look at every screen with nothing in it", "Day one for every user. If it is blank, it is a wasted teaching moment and reads as broken."],
  ["Look at every screen with far too much in it", "Two hundred rows. Does it still work? Does anything need a scrollbar it does not have?"],
  ["Check a language where words are much longer than English", "Even if you only ship English, it exposes every place a fixed width was assumed.", { o: 1 }],
  ["Check what happens when an image is missing or slow", "A broken image icon in the middle of your layout, or a page that jumps as things load, both read as unfinished."]
 ]},
 { n: "Prove it works on other devices — do not assume", items: [
  ["Have the AI check for sideways scrolling at specific widths, and report back", "A broken layout still renders and nothing errors, so nobody finds out. The only reliable method is to measure.",
    { p: "Check my layout for horizontal overflow at these widths: 320, 360, 390, 430, 600, 768, 820, 1024, 1280 and 1440 pixels.\n\nAt each width, compare the page's scroll width against its visible width and name any element wider than the screen. Then repeat the whole check with the browser text size set to 200%.\n\nAlso measure the smallest tappable control at each width and tell me if anything is under 44 pixels.\n\nReport this as a table of results. Do not tell me it looks fine — give me the measurements." }],
  ["Check the sizes between your breakpoints, not just phone and desktop", "Most broken layouts are broken at 768 or 1024, because those widths were never looked at."],
  ["Check it with the text size turned up", "If your breakpoints are in pixels but your text scales, the layout will not react to larger text at all. This catches a whole class of problem at once."],
  ["Check a phone held sideways", "A short, wide screen. Anything stuck to the top of the screen can end up eating most of the visible area."],
  ["Test on a real phone, not a narrowed browser window", "Narrowing a window misses everything device-specific: the notch, the on-screen keyboard covering the field being typed in, hover effects that stick after tapping, and the address bar changing the screen height as you scroll."],
  ["Check that tapping something does not leave it stuck looking hovered", "Hover effects are for mouse pointers. On a touchscreen they can stay on after a tap, which looks broken.", { o: 1 }],
  ["Check that tapping a field does not zoom the page in", "On iPhones, a text box with text smaller than 16 pixels causes the whole page to zoom when tapped. Ask the AI to confirm no input is under 16 pixels.", { o: 1 }]
 ]},
 { n: "Visual consistency", items: [
  ["Define one spacing scale and use it everywhere", "Inconsistent gaps are what actually reads as amateur — more than any single ugly choice.",
    { p: "Define a small, consistent design system for my product and apply it everywhere:\n\n- one spacing scale used for all gaps and padding\n- a limited colour palette with clear roles (normal text, quiet text, borders, one accent, plus error, warning and success)\n- one type scale with a few defined sizes and weights\n- one corner radius and one shadow style, used consistently\n\nThen go through every screen and make it conform. List anything that didn't fit and why." }],
  ["Limit yourself to a few text sizes and two weights", "More variety looks less designed, not more."],
  ["Pick a small palette and give each colour a job", "Text, quiet text, borders, one accent, plus error, warning and success."],
  ["Use one corner rounding and one shadow style throughout", "Mixing them is a strong beginner signal."],
  ["Use one font family, or at most two that look clearly different", "Two similar fonts look like a mistake rather than a choice."],
  ["Check every screen against the system and fix what drifted", "Things drift. Doing this sweep once is worth several new features."],
  ["Check it looks right in dark mode, or deliberately don't offer one", "Half-working dark mode is worse than none.", { o: 1 }]
 ]},
 { n: "Every state, not just the happy one", items: [
  ["Show something whenever the product is thinking", "A frozen screen for two seconds reads as broken. The fastest way to look amateur."],
  ["Write the empty screens properly", "Before anyone has added anything, say what goes here and give them the button to start. Your best teaching moment."],
  ["Write every error message yourself", "'That email is already registered — try signing in instead' rather than 'Error: duplicate entry'. Does more for perceived quality than most visual work."],
  ["Confirm when something worked", "Silence after an action makes people click again."],
  ["Handle the offline and connection-lost case", "Say what happened and let them retry without losing what they typed."],
  ["Make a real 'page not found' page", "With a way back. The default one is a visible sign nobody looked."],
  ["Make a real error page for when things break badly", "Calm, honest, with a way to get help."]
 ]},
 { n: "Forms and input", items: [
  ["Label every field properly", "Placeholder text that vanishes when you type is not a label."],
  ["Show errors next to the field, not only at the top", "And say what to do about it."],
  ["Never clear someone's input because one field was wrong", "Losing a filled-in form is one of the most enraging experiences on the internet."],
  ["Disable the submit button while it's submitting", "Real people double-click. Especially on anything involving money."],
  ["Use the right keyboard on phones", "Number fields should bring up numbers. A small detail people notice instantly."],
  ["Let the browser fill in what it can", "Ask the AI to set correct autocomplete settings."],
  ["Warn before losing unsaved work", "Or save automatically. Either is fine; neither is not.", { o: 1 }],
  ["Make required versus optional obvious before submitting", ""]
 ]},
 { n: "Phones and small screens", items: [
  ["Test on a real device, held in one hand", "Not a narrow browser window."],
  ["Make every tap target big enough for a thumb", "Small links next to each other are a constant source of frustration."],
  ["Check nothing needs sideways scrolling", "Usually caused by one wide table or image."],
  ["Check the keyboard doesn't hide the field being typed in", "A classic and very visible bug."],
  ["Check it works both upright and sideways", "", { o: 1 }],
  ["Check tables turn into something usable on a small screen", "", { o: 1 }],
  ["Test the phone app on both an old and a new device", "", { c: "mobile" }]
 ]},
 { n: "Usable by everyone", items: [
  ["Complete the main journey using only the keyboard", "Tab and Enter. If you can't, neither can a chunk of your users."],
  ["Make sure you can always see where the keyboard is", "Never remove the focus outline without replacing it with something visible."],
  ["Check text contrast against its background", "Grey on grey and thin light text fail for many people in ordinary daylight."],
  ["Add descriptions to every meaningful image", "And leave decorative ones marked as decorative."],
  ["Make sure headings are in a sensible order", "Screen readers use them to navigate. So do search engines."],
  ["Never rely on colour alone to convey meaning", "Add a word or an icon as well."],
  ["Respect the setting for reduced motion", "Animation makes some people physically unwell.", { o: 1 }],
  ["Run an accessibility checker, then test by hand as well", "Automatic tools catch a minority of problems. They're a floor, not a pass."]
 ]},
 { n: "The words", items: [
  ["Make every button say what it does", "'Save changes', not 'Submit'. And the confirmation afterwards uses the same word."],
  ["Use the same word for the same thing everywhere", "If it's a 'project' on one screen it isn't a 'workspace' on another."],
  ["Remove every placeholder and sample text", "No lorem ipsum, no grey boxes, no 'coming soon' on anything reachable."],
  ["Read all your text aloud and cut what's unnecessary", "Interface text should be shorter than you first wrote it."],
  ["Check spelling and grammar everywhere", "Including error messages and emails. A typo on a payment screen costs real trust."],
  ["Make the first-time experience explain itself", "A new person should understand what to do without being told by you."],
  ["Write the emails your product sends as carefully as the screens", "They're often the only thing a person sees for weeks.", { o: 1 }]
 ]},
 { n: "The finishing touches people notice", items: [
  ["Add a real icon for the browser tab", "A default icon there is one of the most visible beginner tells."],
  ["Write a proper page title for every page", "It shows in the tab, in search results and in bookmarks."],
  ["Set up the preview card for shared links", "Title, description, image. Paste your link into a chat app and look at what appears.", { c: "public" }],
  ["Add the home-screen icons for phones", "", { c: "public", o: 1 }],
  ["Check how it looks when printed", "Some people still print. Usually a few lines of work.", { o: 1 }],
  ["Add your app store screenshots and description", "The most-seen and least-considered part of a phone app.", { c: "mobile" }],
  ["Make sure the loading of fonts and images doesn't make text jump", "Content shifting as the page loads is a strong signal of unfinished work."]
 ]}
]},


/* ================= 11 (new) ================= */
{
id: "lic", name: "Check the rights and licences",
why: "Almost everything in your product — libraries, fonts, images, icons, even some of the code the AI produces — belongs to someone, and comes with conditions. Meeting them is cheap now and expensive later.",
plain: "<b>In plain terms:</b> using other people's work without permission is the mistake that surfaces exactly when you can least afford it — when the product succeeds. None of this needs a lawyer for a normal project. It needs an afternoon with a list.",
gate: "You know the licence of everything you ship, you've met each licence's conditions, and you've decided the rights on your own work.",
sections: [
 { n: "The code you use from others", items: [
  ["Run a licence check on every library you use", "Every library comes with a licence stating what you may do and what you owe in return. You cannot meet conditions you haven't read.",
    { p: "List every library and dependency my project uses, directly or indirectly, with its licence.\n\nGroup them:\n1. Permissive (MIT, BSD, Apache 2.0, ISC and similar) - use freely, keep the notice.\n2. Weak copyleft (LGPL, MPL) - conditions apply to changes I make to the library itself.\n3. Strong copyleft (GPL, AGPL) - conditions may extend to MY code.\n4. Unknown or no licence - treat as not usable.\n\nFor each group, tell me in plain English exactly what I must do to comply. Flag anything AGPL or GPL prominently. Then generate a THIRD-PARTY-NOTICES file listing every library, its author and its licence text or reference." }],
  ["Understand the two families: permissive and copyleft", "Permissive licences (MIT, BSD, Apache) let you use the code in anything, including a paid product, as long as you keep their copyright notice. Copyleft licences (GPL family) can require you to share YOUR code under the same terms. Neither is bad — but you must know which you're taking."],
  ["Treat AGPL libraries as a decision, not a default", "AGPL is written for exactly your situation: it can require you to publish your source code merely for running the library in an online service. Sometimes that's fine. It must never be an accident.",
    { c: "public", w: "This is the single most common licence trap for online products. Check for AGPL before you build on something, not after." }],
  ["Keep the notices you're required to keep", "Permissive licences almost all require one thing: keep the copyright and licence text. Ship a THIRD-PARTY-NOTICES file, or a credits page, listing them."],
  ["Never use a library that has no licence at all", "No licence does not mean free — it means all rights reserved. You have no permission to use it."],
  ["Don't paste code from websites without checking its terms", "Code in a blog post or forum answer has an owner and often a licence. Small snippets are usually fine; whole files are not."],
  ["Treat AI-generated code as your responsibility", "AI can occasionally reproduce recognisable pieces of licensed code. For anything substantial and distinctive, ask the AI whether it resembles a known project, and prefer having it write from your description rather than 'like library X'."]
 ]},
 { n: "Fonts, images, icons and media", items: [
  ["Check the licence of every font you use", "Fonts are software with licences. A font free for personal use is not free for your product. Fonts under the SIL Open Font Licence (most of Google Fonts) are safe for web and commercial use; fonts that came with your computer usually are not licensed for embedding in a website or app."],
  ["Check web use specifically, not just 'free'", "Some font licences allow desktop documents but not serving the font on a website or bundling it in an app. Those are separate permissions."],
  ["Know what each Creative Commons letter means before using CC material", "BY: credit the creator. SA: anything you build with it must carry the same licence. NC: no commercial use — which includes your paid product and usually even an ad-supported one. ND: no modifications. CC0: no conditions at all. The letters combine, and NC is the one that catches people.",
    { w: "A CC 'non-commercial' image inside a product that makes money is a straightforward violation, and image owners do send demands. Check the letters, not just the words 'Creative Commons'." }],
  ["'Found it on Google' is not a licence", "Search results show everything, licensed or not. Use sources that state the licence, and keep the link."],
  ["Keep a simple record of every asset you didn't make", "One list: the file, where it came from, its licence, and whether credit is required. Five minutes per asset now; unanswerable questions later without it."],
  ["Give the credit where credit is a condition", "CC-BY and many free photo and icon licences require attribution in a reasonable place — a credits page is fine. Required means required."],
  ["Check icon sets and UI kits the same way", "Icon packs mix licences; some free tiers require attribution, some forbid resale. Read the page you downloaded from."],
  ["Check music, video and sound effects with extra care", "Audio is the most aggressively enforced media type on the internet. 'Royalty-free' still has a licence with conditions — read it.", { o: 1 }]
 ]},
 { n: "Your own rights", items: [
  ["Put a copyright line on your product", "\u00a9 [year] [your name or company]. It costs nothing and states your claim. In most countries copyright exists automatically when you create something; the notice makes it visible."],
  ["Decide the licence of your own code, deliberately", "Keeping it private (all rights reserved) is the default and needs no action. Open-sourcing it is generous and sometimes smart — but choose a licence (MIT for maximum adoption, AGPL to keep derivatives open) rather than just making the code public, and understand you can't take back what you've released.",
    { p: "Help me decide the rights on my own code. My situation: [describe: is it a business? do you want others to use the code? would it hurt you if a competitor used it?]\n\nExplain my realistic options in plain English: all rights reserved, MIT/Apache, GPL, AGPL, or a source-available licence. For each: what others could then legally do with my work, what I could no longer prevent, and what businesses like mine usually choose. Then recommend one and say why." }],
  ["Know that AI-generated work has uncertain copyright", "In several countries, work generated entirely by AI without meaningful human authorship may not be copyrightable at all — meaning you might not be able to stop others copying it. The more you shape, edit and direct the work, the stronger your claim. The law here is new and varies by country.",
    { w: "This is an evolving legal area. This checklist is not legal advice; for anything valuable, get real advice in your country." }],
  ["Check your product's name before you get attached to it", "Search the trademark registries of the countries you'll sell in, plus a plain web search. Renaming after launch costs the name, the domain, the accounts and the recognition."],
  ["Register the domain and the obvious usernames early", "Cheap insurance. Do it the day you settle on the name.", { o: 1 }],
  ["Settle ownership if anyone helps you build", "A friend who writes code owns the copyright on what they wrote unless you agree otherwise in writing. One signed paragraph now prevents an ugly conversation later.", { o: 1 }]
 ]},
 { n: "Promises you've made to services", items: [
  ["Check the terms of every service and API you build on", "Payment providers, map services, data sources and login providers all have usage terms — what you may store, show, resell or cache. Breaking them gets your access switched off, which for a product built on them is fatal."],
  ["Check what your AI tools say about using their output", "The major AI assistants permit commercial use of what they generate for you, but the terms differ and change. Read the current terms of the ones you actually use."],
  ["Show the open-source notices where the platform requires it", "App stores expect bundled open-source licences to be viewable inside the app - the standard 'open source licences' screen in settings.", { c: "mobile" }],
  ["Re-run the licence check whenever you add a dependency", "The scan from the first step is a habit, not a one-off. A single new library can change your obligations.", { o: 1 }]
 ]}
]},

/* ================= 12 ================= */
{
id: "s11", name: "Get ready to publish",
why: "Releasing should be boring and reversible. If publishing is scary you'll avoid it, and avoided releases pile up into risky ones.",
plain: "<b>In plain terms:</b> you want one button that publishes, one that undoes it, and to have tried the undo at least once while nothing was wrong.",
gate: "You can publish and undo with one action each, you've practised the undo, and alerts reach you.",
sections: [
 { n: "Publishing", items: [

/* ---------- plain-English word list ---------- */
var GLOSSARY = [
  ["Version control", "A system that keeps every past version of your work, so you can always go back to how things were yesterday or last month. It is the undo button for the whole project."],
  ["Repository (or repo)", "The folder where your project and all its saved versions live. Usually kept online so it is safe if your computer is lost."],
  ["Commit", "Saving a set of changes into version control, with a short note saying what you changed and why."],
  ["Branch", "A separate copy of the project where you can try something without affecting the working version."],
  ["Database", "The organised store where your product keeps its information — people, orders, messages and so on. Like a filing cabinet with strict rules about what goes in each drawer."],
  ["Schema (or data structure)", "The plan of how that filing cabinet is arranged: what is stored, and how the pieces connect to each other."],
  ["Migration", "A recorded, reversible change to the arrangement of the filing cabinet. Recorded so you can undo it and so it happens the same way everywhere."],
  ["Server", "A computer, usually rented, that runs your product and answers requests from people using it."],
  ["Hosting", "The service you rent that computer from."],
  ["Deployment (or publishing)", "Putting a new version of your product onto the live system so real people can use it."],
  ["Environment", "A separate copy of your product. Most projects have three: one on your own machine, one for testing, and the live one real people use."],
  ["Staging", "The testing copy. It looks and behaves like the live one but nobody outside uses it."],
  ["Production (or live)", "The copy that real people actually use."],
  ["Framework", "A ready-made set of building blocks for a particular kind of product, so you do not start from nothing."],
  ["Library (or package, or dependency)", "A piece of software written by someone else that your product uses. Each one is something you must keep updated."],
  ["Lock file", "A file that records the exact version of every library you use, so everyone gets identical software."],
  ["API", "The way two pieces of software talk to each other. Your product uses an API to ask a payment company to take a payment, for example."],
  ["Endpoint", "One specific address in an API that answers one specific request."],
  ["Token (or key, or secret)", "A long password that lets your product use a paid service. Anyone who has it can spend your money, so it is never written into the code."],
  ["Authentication", "Checking who somebody is. In plain terms, signing in."],
  ["Authorisation (or permission)", "Checking whether that person is allowed to do the thing they are asking to do. Different from signing in, and more often got wrong."],
  ["Session", "The period between someone signing in and signing out, during which the product remembers who they are."],
  ["Encryption", "Scrambling information so that it is unreadable to anyone without the key."],
  ["Hashing", "A one-way scramble used for passwords. Even you cannot turn it back into the original password, which is the point."],
  ["Validation", "Checking that what somebody typed makes sense before acting on it."],
  ["Cache", "A temporary copy of something kept nearby so it can be produced quickly the next time it is asked for."],
  ["Rate limiting", "A cap on how many times something can be done in a period, so one person cannot overwhelm your product or run up your bill."],
  ["Continuous integration (CI)", "Machines that automatically check your work every time you change something, and refuse the change if a check fails."],
  ["Automated test", "A small piece of software that uses your product the way a person would and complains if the answer is wrong."],
  ["Regression", "Something that used to work and has stopped working because of a later change."],
  ["Rollback", "Undoing a release and putting the previous version back."],
  ["Feature flag (or switch)", "A switch that turns a feature on or off without republishing, so risky things can be turned off quickly."],
  ["Multi-tenant", "One system serving several separate customer organisations, each of which must never see the others' information."],
  ["Backup", "A stored copy of your information kept somewhere separate, so it can be restored if the live one is lost or damaged."],
  ["Uptime monitoring", "A service that keeps checking your product is working and tells you when it is not."],
  ["Logs", "A running written record of what your product did, used to work out what went wrong."],
  ["PWA", "A website that can be added to a phone's home screen and behaves much like an installed app."],
  ["Responsive design", "Building screens that rearrange themselves to fit whatever size of screen someone is using."],
  ["Accessibility", "Making sure people with reduced sight, hearing, movement or attention can use the product. Often shortened to a11y."],
  ["Scope", "What the product will and will not do. Scope creep is when this quietly grows until nothing ever ships."],
  ["Specification (or spec)", "The written description of what you are building, who it is for, and what counts as finished."],
  ["Licence", "The permission that comes with someone else's work, stating what you may do with it and what you owe in return. Everything you didn't make yourself has one — or worse, doesn't."],
  ["Copyright", "Automatic ownership of creative work — code, writing, images, music — the moment it is made. You need the owner's permission (a licence) to use their work."],
  ["All rights reserved", "The default. No licence has been granted, so others may not use the work. Applies to your code unless you choose otherwise, and to theirs."],
  ["Open source", "Code published under a licence that lets anyone use, study and change it. Open source is not the absence of conditions — the licence states the conditions."],
  ["Permissive licence (MIT, BSD, Apache, ISC)", "The friendly family. Use the code in anything, including a paid product, as long as you keep the author's copyright notice. Apache 2.0 also settles patent questions, which larger companies like."],
  ["Copyleft (GPL family)", "The share-alike family. You may use the code, but work built on it can be required to carry the same licence — meaning you might have to publish your own source."],
  ["AGPL", "The strictest common copyleft licence, written for online services: even just running AGPL code in your web product can oblige you to publish your source. Use it knowingly or not at all."],
  ["LGPL and MPL", "The middle ground. Roughly: you can use the library in a private product, but changes to the library itself must be shared."],
  ["Creative Commons (CC)", "A set of licences for images, writing, music and other media. Letters state the conditions — BY: give credit. SA: share alike. NC: no commercial use. ND: no changes. They combine, e.g. CC BY-NC."],
  ["CC0 and public domain", "No conditions at all. Free to use for anything, no credit required. The safest kind of found material."],
  ["Attribution", "Giving the required credit — usually the creator's name and the licence, on a credits page. When the licence says BY, this is a condition, not a courtesy."],
  ["Royalty-free", "You pay once (or nothing) instead of per use. It is not the same as no conditions — there is still a licence, and it still has limits."],
  ["Trademark", "Rights over a name or logo used in trade. A different thing from copyright: it's what stops you calling your product something a company already owns."],
  ["Third-party notices file", "The file (or credits screen) that ships with your product listing every open-source library you used and its licence — the one thing nearly every permissive licence demands."],
  ["Font licence (and OFL)", "Fonts are software with licences. The SIL Open Font Licence, used by most fonts on Google Fonts, allows free commercial and web use. Fonts that came with your computer usually don't."],
  ["Component", "A part of the interface built once and reused everywhere — one button, one input box, one card. Building each screen's buttons separately is why AI-built products end up with buttons of different shapes and sizes."],
  ["Design system", "The small set of decisions every screen follows: one spacing scale, a few text sizes, a limited palette, one corner radius, one shadow. Consistency across screens is what reads as professional."],
  ["Breakpoint", "A screen width at which the layout rearranges — for example switching from two columns to one. Having breakpoints is not the same as having checked them."],
  ["Overflow", "Content spilling outside the space meant to hold it — text escaping a button, or a page that scrolls sideways. Usually caused by a fixed height or width where the content needed room to grow."],
  ["Truncation", "Cutting text off, usually with three dots. It hides information the person needed, and on a touchscreen there is no way to reveal it. Let text wrap instead unless you have a reason."],
  ["rem", "A size that scales with the reader's chosen text size. Sizes fixed in pixels ignore that choice, which is why a layout can fail the moment someone enlarges the text."],
  ["Empty state", "What a screen shows before there is anything in it. Every user sees it on day one, and a blank screen reads as broken."],
  ["Placeholder content", "Sample text and images used while building. Designing against tidy samples is why layouts break on real names, real errors and real amounts."],
  ["Hierarchy", "Guiding the eye to what matters, using size, weight and space. Adding decoration everywhere instead emphasises nothing, and that flatness is what looks amateur."],
  ["Prompt", "The exact wording you type into an AI assistant to ask for something."],
  ["Large language model (LLM)", "The kind of AI these tools are built on. It predicts likely text, which is why it can be confidently wrong."]
];

var mem = {};

/* a stage marked complete reopens if its essential work is later unticked,
   removed, or new essential steps appear (new conditions, added steps) */
function reconcileStages(){
  var reopened=[];
  if(!state || !state.setup) return reopened;
  STAGES.forEach(function(st){
    if(state.stageDone[st.id] && stageCount(st).r>0){
      delete state.stageDone[st.id];
      reopened.push(st.name);
    }
  });
  return reopened;
}
var savedT;

  var c=document.getElementById("savedChip"); if(!c) return;
  if(persistOK){
    c.textContent="Saved \u2713";
    c.classList.remove("warn");
    c.classList.add("flash");

  } else {

    if(!warnedNoSave){
      warnedNoSave=true;
      setTimeout(function(){ say("Your browser is refusing to save on this device, so your work will be lost when this page closes. Go to Progress and use \u201cSave a copy to my computer\u201d to keep it."); },50);
    }
  }
}
var persistOK=true, warnedNoSave=false, reopenMsgQueue=[];
var savePending=false, saveQueued=false;
function save(){
  /* never write over the scrambled file before it has been opened */
  if(typeof LOCK!=="undefined" && LOCK.needUnlock) return;
  reopenMsgQueue = reconcileStages();
  if(typeof LOCK!=="undefined" && LOCK.on && LOCK.master){ saveEncrypted(); pulseSaved(); return; }
  var r=JSON.stringify(root);
  var ok=false;
  if(store){ try{ store.setItem(KEY,r); ok=true; }catch(e){ ok=false; } }
  if(!ok) mem[KEY]=r;
  persistOK=ok;
  pulseSaved();
}
function saveEncrypted(){
  if(savePending){ saveQueued=true; return; }
  savePending=true;
  sealRoot().then(function(blob){
    var ok=false;
    if(store){ try{ store.setItem(KEY,blob); ok=true; }catch(e){ ok=false; } }
    if(!ok) mem[KEY]=blob;
    persistOK=ok; savePending=false;
    if(saveQueued){ saveQueued=false; saveEncrypted(); }
    pulseSaved();
  }).catch(function(){ savePending=false; persistOK=false; pulseSaved(); });
}

  if(reopenMsgQueue.length){
    var n=reopenMsgQueue.slice(0,2).join('" and "');
