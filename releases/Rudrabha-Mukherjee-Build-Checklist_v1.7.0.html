/* ==========================================================================
   LOCK
   A PIN scrambles this checklist on this device. Three questions are the way
   back in if the PIN is forgotten.

   Be honest about the trade. Answers to questions about a person's life are a
   much smaller secret than a PIN, and the people most likely to be holding
   this device are often the people who can answer them. The questions path
   therefore costs far more per guess, the answers must be long, and the
   screens say plainly that somebody who knows the reader may get in. Do not
   reword those screens into a promise the lock cannot keep.
   ========================================================================== */
var LOCK = { on:false, master:null, needUnlock:false, blob:null };
var KDF_PIN = 250000;
var KDF_ANSWERS = 1200000;

function cryptoOK(){ return !!(window.crypto && window.crypto.subtle && window.isSecureContext); }
function b64(buf){ var b=new Uint8Array(buf), r=""; for(var i=0;i<b.length;i++) r+=String.fromCharCode(b[i]); return btoa(r); }
function unb64(str){ var r=atob(str), a=new Uint8Array(r.length); for(var i=0;i<r.length;i++) a[i]=r.charCodeAt(i); return a; }
function rnd(n){ return crypto.getRandomValues(new Uint8Array(n)); }

var ANSWER_SEP = "\u001f";
function normAnswer(a){ return String(a==null?"":a).trim().toLowerCase().replace(/\s+/g," "); }
function answersSecret(list){ return (list||[]).map(normAnswer).join(ANSWER_SEP); }
var QUESTION_IDEAS = [
  "What was the name of the street you grew up on?",
  "What was your first teacher called?",
  "What was the name of your first pet?",
  "Which town was your mother born in?",
  "What was the make of your first bicycle or motorbike?",
  "Who was your closest friend when you were ten?",
  "What did you eat on your first day at work?",
  "What was the name of the shop nearest your childhood home?"
];
/* One answer is the whole of this way in, so it is held to a longer minimum.
   A short answer here is a short answer to the entire lock. */
var ANSWER_MIN = 8;
function checkAnswer(a){
  var n=normAnswer(a);
  if(!n) return "Please answer your question.";
  if(n.length<ANSWER_MIN) return "That answer is too short. Please use at least "+ANSWER_MIN+" letters. A few words is better than one.";
  if(/^\d+$/.test(n)) return "Please use words, not only numbers. Numbers alone are quick to guess.";
  return "";
}
function keyFrom(secret, salt, rounds){
  return crypto.subtle.importKey("raw", new TextEncoder().encode(secret), "PBKDF2", false, ["deriveKey"])
    .then(function(base){
      return crypto.subtle.deriveKey({ name:"PBKDF2", salt:salt, iterations:(rounds||KDF_PIN), hash:"SHA-256" },
        base, { name:"AES-GCM", length:256 }, false, ["wrapKey","unwrapKey"]);
    });
}
function newMasterKey(){ return crypto.subtle.generateKey({ name:"AES-GCM", length:256 }, true, ["encrypt","decrypt"]); }
function wrapMaster(master, wrapper){
  var iv=rnd(12);
  return crypto.subtle.wrapKey("raw", master, wrapper, { name:"AES-GCM", iv:iv })
    .then(function(w){ return { iv:b64(iv), data:b64(w) }; });
}
function unwrapMaster(pack, wrapper){
  return crypto.subtle.unwrapKey("raw", unb64(pack.data), wrapper,
    { name:"AES-GCM", iv:unb64(pack.iv) }, { name:"AES-GCM", length:256 }, true, ["encrypt","decrypt"]);
}
function sealRoot(){
  var iv=rnd(12);
  var data=new TextEncoder().encode(JSON.stringify(root));
  return crypto.subtle.encrypt({ name:"AES-GCM", iv:iv }, LOCK.master, data).then(function(ct){
    var b=LOCK.blob||{};
    b.enc=true; b.v=(b.q?2:1); b.iv=b64(iv); b.data=b64(ct);
    LOCK.blob=b;
    return JSON.stringify(b);
  });
}
function openRoot(blob, secret, which){
  var saltRaw, pack, rounds;
  if(which==="pin"){ saltRaw=blob.saltP; pack=blob.wrapP; rounds=KDF_PIN; }
  else { saltRaw=blob.saltQ; pack=blob.wrapQ; rounds=KDF_ANSWERS; }
  if(!pack||!saltRaw) return Promise.reject(new Error("no such way in"));
  return keyFrom(secret, unb64(saltRaw), rounds).then(function(wrapper){
    return unwrapMaster(pack, wrapper);
  }).then(function(master){
    return crypto.subtle.decrypt({ name:"AES-GCM", iv:unb64(blob.iv) }, master, unb64(blob.data))
      .then(function(pt){ return { master:master, text:new TextDecoder().decode(pt) }; });
  });
}
function hasAnswers(b){ return !!(b && b.wrapQ && b.saltQ && (typeof b.q==="string" || (b.qs && b.qs.length===3))); }
function lockQuestions(b){ return (b && typeof b.q==="string") ? [b.q] : ((b && b.qs)||[]); }
function checkLocked(){
  var raw=(store&&store.getItem(KEY))||mem[KEY];
  if(!raw) return false;

   A dialog that claims to cover the screen must really cover it. Tab stays
   inside it, Escape closes it from anywhere, and when it closes the keyboard
   goes back to the button that opened it. Somebody working without a mouse
   should never be stranded behind an open dialog.
   ========================================================================== */
var preModalFocus=null, preModalSel="";
/* A re-render replaces the button that opened the dialog, so remember how to
   find it again as well as the element itself. */
function selectorFor(e){
  if(!e||e.nodeType!==1) return "";
  if(e.id) return "#"+CSS.escape(e.id);
  var names=["data-askdel","data-edit","data-k","data-goto","data-switch","data-open","data-addopen","data-f","data-copy"];
  for(var i=0;i<names.length;i++){
    var v=e.getAttribute&&e.getAttribute(names[i]);
    if(v) return "["+names[i]+'="'+CSS.escape(v)+'"]';
  }
  return "";
}
function dialogNow(){ return modal.querySelector(".dialog"); }
function focusablesIn(el){
  var sel='button:not([disabled]),[href],input:not([disabled]):not([type="hidden"]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])';
  return Array.prototype.filter.call(el.querySelectorAll(sel),function(e){
    return e.offsetWidth>0||e.offsetHeight>0||e===document.activeElement; });
}
function restoreFocusAfterModal(){
  var t=preModalFocus;
  if(t&&document.contains(t)&&(t.offsetWidth||t.offsetHeight)){ try{ t.focus(); return; }catch(e){} }
  if(preModalSel){
    var again=null; try{ again=document.querySelector(preModalSel); }catch(e){}
    if(again&&(again.offsetWidth||again.offsetHeight)){ try{ again.focus(); return; }catch(e){} }
  }
  var head=document.querySelector("#app h1");
  if(head){ head.setAttribute("tabindex","-1"); try{ head.focus(); }catch(e){} }
}
function closeModal(){ modal.innerHTML=""; restoreFocusAfterModal(); }
document.addEventListener("focusin",function(e){
  if(!modal.contains(e.target)){ preModalFocus=e.target; preModalSel=selectorFor(e.target); }
},true);
document.addEventListener("keydown",function(e){
  var d=dialogNow(); if(!d) return;
  if(e.key==="Escape"){
    e.preventDefault();
    modal.innerHTML="";
    if(state){ state.pendingDelete=""; try{ save(); }catch(err){} }
    if(typeof rerender==="function") rerender();
    restoreFocusAfterModal();
    return;
  }
  if(e.key!=="Tab") return;
  var f=focusablesIn(d); if(!f.length){ e.preventDefault(); return; }
  var first=f[0], last=f[f.length-1], here=document.activeElement;
  if(!d.contains(here)){ e.preventDefault(); (e.shiftKey?last:first).focus(); return; }
  if(e.shiftKey&&here===first){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey&&here===last){ e.preventDefault(); first.focus(); }
},true);

    var scan=function(essOnly){
      for(var si2=0; si2<s.sections.length && !nextKey; si2++){
        s.sections[si2].items.forEach(function(it,ii){
          if(nextKey || !applies(it)) return;
          if(essOnly && opts(it).o) return;
          var kk=key(s,si2,ii);
          if(!state.done[kk]) nextKey=kk;
        });
        if(!nextKey) customs(s,si2).forEach(function(c){ if(!nextKey && !state.done["c:"+c.id]) nextKey="c:"+c.id; });
      }
      if(!nextKey) customs(s,"own").forEach(function(c){ if(!nextKey && !state.done["c:"+c.id]) nextKey="c:"+c.id; });
    };
    scan(true); if(!nextKey) scan(false);
  }
  h+='<div class="sections">';
  var shown=0, secList=[];
  s.sections.forEach(function(sec,si){ secList.push({si:si,n:sec.n,sec:sec}); });
  secList.push({si:"own",n:"Anything else for this stage",sec:null});

  secList.forEach(function(entry){
    var si=entry.si, rows="";
    if(entry.sec){
      entry.sec.items.forEach(function(it,ii){
        if(!applies(it)) return;
        if(state.filter==="next"){ if(key(s,si,ii)!==nextKey) return; }
        else if(!passesFilter(s,si,ii,it)) return;
        rows+=itemHTML(s,si,it,ii,""); shown++;
      });
    }
    customs(s,si).forEach(function(c){
      if(state.filter==="next"){ if("c:"+c.id!==nextKey) return; }
      else if(state.filter==="remaining" && state.done["c:"+c.id]) return;
      rows+=customHTML(c,""); shown++;
    });
    var cc=secCount(s,si);
    if(si!=="own" && cc.t===0) return;
    if(state.filter==="next" && !rows){ if(si!=="own" || nextKey) return; }
    var closeK=s.id+":"+si, isOpen=!state.closed[closeK];
    if(state.adding===bucket(s,si)) isOpen=true;
    if(state.editing && customs(s,si).some(function(c){ return c.id===state.editing; })) isOpen=true;
    h+='<div class="sec'+(isOpen?" open":"")+'"><button class="sec-head" data-open="'+esc(closeK)+'" aria-expanded="'+isOpen+'">';
    h+='<span class="nm">'+esc(entry.n)+'</span><span class="ct">'+cc.d+' of '+cc.t+' done</span><span class="tog">'+(isOpen?"Hide these steps":"Show these steps")+'</span></button>';
    h+='<div class="sec-body">';
    if(rows) h+='<ul class="items">'+rows+'</ul>';
    else if(si==="own") h+='<div class="empty">Nothing here yet. Use this group for anything the checklist does not already cover.</div>';
    else h+='<div class="empty">Nothing in this group matches what you chose to show.</div>';
    h+=addRowHTML(s,si);
    h+='</div></div>';
  });
  if(!shown){
    if(state.filter==="next") h+='<div class="empty">Every step in this stage is done. Move on to the next stage, or choose <b>Show all steps</b> to look back over them.</div>';
    else h+='<div class="empty">Every step in this stage is done. Choose <b>Show all steps</b> above to see them again.</div>';
  }
  h+='</div>';

  h+='<div class="notes"><label for="stageNote">Your notes for this stage</label>';
  h+='<textarea id="stageNote" placeholder="Anything about your own project — decisions you made, things to come back to.">'+esc(state.notes[s.id]||"")+'</textarea></div>';

  var cleared=c.r===0;
  h+='<div class="gate'+(cleared?" cleared":"")+'"><h2>Before you move on</h2><p>'+esc(s.gate)+'</p><div class="gate-actions">';
  h+='<button class="btn '+(cleared?"go":"")+'" id="markStage"'+(cleared?"":" disabled")+'>'+(state.stageDone[s.id]?"Stage "+(state.current+1)+" is complete":"Mark stage "+(state.current+1)+" complete")+'</button>';
  h+='<span class="gate-note">'+(cleared?("All essential steps are done. You can continue."):(c.r+" essential "+(c.r===1?"step is":"steps are")+" still to do"))+'</span></div></div>';
  h+='</section></div>';

  h+='<div class="nav">';
  h+='<button class="btn ghost" id="prev"'+(state.current===0?" disabled":"")+'>Go to stage '+(state.current||1)+'</button>';
  h+='<button class="btn ghost" id="next"'+(state.current===STAGES.length-1?" disabled":"")+'>Go to stage '+Math.min(STAGES.length,state.current+2)+'</button>';
  h+='</div>';

  app.innerHTML=h;
  renderModal();

  var ra=document.getElementById("readAloud");
  if(ra) ra.addEventListener("click",function(){ toggleSpeech(s, ra); });
  var hh=document.getElementById("hideHelp");
  if(hh) hh.addEventListener("click",function(){ state.helpShown=false; save(); renderRoute(); });
  app.querySelectorAll("[data-goto]").forEach(function(b){ b.addEventListener("click",function(){ stopSpeech(); state.current=+b.dataset.goto; save(); renderRoute(); pushHash(); window.scrollTo(0,0); }); });
  app.querySelectorAll("[data-open]").forEach(function(b){
    b.addEventListener("click",function(){ var k=b.dataset.open; if(state.closed[k]) delete state.closed[k]; else state.closed[k]=1; save(); renderRoute(); });
  });
  app.querySelectorAll("[data-f]").forEach(function(b){ b.addEventListener("click",function(){ state.filter=b.dataset.f; save(); renderRoute(); }); });
  document.getElementById("q").addEventListener("input",function(e){
    state.q=e.target.value; save();
    if(state.q.trim()){ renderSearch(); var n=document.getElementById("q"); n.focus(); n.setSelectionRange(n.value.length,n.value.length); }
  });
  var nt=document.getElementById("stageNote");
  if(nt) nt.addEventListener("input",function(e){ state.notes[s.id]=e.target.value; clearTimeout(nt._t); nt._t=setTimeout(save,300); });
  wireItems();
  wireInstallBanner();

  var ms=document.getElementById("markStage");
  if(ms) ms.addEventListener("click",function(){
    state.stageDone[s.id]=1; save();

    say("Stage "+was+" marked complete.");

var speaking=false;
function stopSpeech(){
  if(window.speechSynthesis){ try{ speechSynthesis.cancel(); }catch(e){} }
  speaking=false;
  var b=document.getElementById("readAloud");
  if(b) b.textContent="Read this stage aloud";
}
function toggleSpeech(stage, btn){
  if(!window.speechSynthesis) return;
  if(speaking){ stopSpeech(); return; }
  var plainText=stage.plain.replace(/<[^>]+>/g," ");
  var parts=["Stage "+(state.current+1)+". "+stage.name+".", stage.why, plainText,
             "The groups of steps in this stage are:"];
  stage.sections.forEach(function(sec){ parts.push(sec.n+"."); });
  var u=new SpeechSynthesisUtterance(parts.join(" "));
  u.rate=0.92; u.onend=function(){ stopSpeech(); };
  speaking=true; btn.textContent="Stop reading";
  try{ speechSynthesis.speak(u); }catch(e){ stopSpeech(); }
}
function rerender(){ if(state.view!=="route") { render(); return; } if(state.q.trim()) renderSearch(); else renderRoute(); }

function wireItems(){
  app.querySelectorAll("[data-addopen]").forEach(function(b){
    b.addEventListener("click",function(){ state.adding=b.dataset.addopen; state.editing=""; save(); rerender();
      var f=document.getElementById("add_t"); if(f) f.focus(); });

  var at=document.getElementById("add_t"), ad=document.getElementById("add_d");

  app.querySelectorAll("[data-k]").forEach(function(b){

function commitAdd(b){
  var t=(document.getElementById("add_t").value||"").trim();
  if(!t){ say("Write what needs doing first, then press Add this step."); return; }
  var d=(document.getElementById("add_d").value||"").trim();
  var sid=b.split("|")[0], si=b.split("|")[1], st=null;
  STAGES.forEach(function(x){ if(x.id===sid) st=x; });
  if(!st) return;
  addCustom(st, si==="own"?"own":+si, t, d);
  delete state.closed[sid+":"+si];
  state.adding=b; save(); rerender(); reopenMsgQueue=[];
  var f=document.getElementById("add_t"); if(f) f.focus();
  say("Your step was added to the checklist.");
}
function kindText(){
  for(var i=0;i<KINDS.length;i++) if(KINDS[i].id===state.kind){
    return state.kind==="other" ? (state.kindOther||"a software product") : KINDS[i].t.toLowerCase();
  }
  return "a software product";
}
function langText(){
  if(state.lang==="other") return (state.langOther||"").trim();
  return state.lang||"English";
}
function personalise(t){
  var lines=["Some context about my project before the request below:"];
  lines.push("- It is called \""+(state.project||"my project")+"\" and it is "+kindText()+".");
  if((state.desc||"").trim()) lines.push("- In one sentence: "+state.desc.trim());
  var facts=[];
  state.conds.forEach(function(c){ if(c!=="other") facts.push(condLabel(c)); });
  if(facts.length) lines.push("- Also true of it: "+facts.join("; ")+".");
  if((state.condOther||"").trim()) lines.push("- Also: "+state.condOther.trim());
  var L=langText();
  if(L && L.toLowerCase()!=="english") lines.push("- Please reply and explain everything in "+L+", using simple, non-technical words.");
  var body=t.replace(/\[one-sentence description\]|\[describe it in one sentence\]/gi, (state.desc||"").trim()||"[describe it in one sentence]");
  return lines.join("\n")+"\n\n"+body;
}
function copyText(t){
  function fb(){
    var ta=document.createElement("textarea"); ta.value=t; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); say("The words were copied. Paste them into your AI assistant."); }
    catch(e){ say("Copying did not work. Select the words and press Ctrl and C together."); }
    document.body.removeChild(ta);
  }
  if(navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t).then(function(){ say("The words were copied. Paste them into your AI assistant."); },fb);
  else fb();
}

function wireLock(){
  var back=document.getElementById("lkBack");
  if(back) back.addEventListener("click",function(){ goView("data"); });
  var on=document.getElementById("lkOn");
  if(on) on.addEventListener("click",function(){
    var a=document.getElementById("lk1").value.trim(), b=document.getElementById("lk2").value.trim();
    if(a.length<6){ say("Please choose six numbers or more. A short PIN is easy to guess."); return; }
    if(a!==b){ say("The two PINs are not the same. Please type them again."); return; }
    var f=readQuestionsForm();
    if(!f||!f.q){ say("Please write your own question, or pick one from the list."); return; }
    var bad=checkAnswer(f.answer); if(bad){ say(bad); return; }
    if(normAnswer(f.answer)===a.toLowerCase()){ say("Please do not use your PIN as your answer."); return; }
    turnLockOn(a,f.q,f.answer);
  });
  var off=document.getElementById("lkOff");
  if(off) off.addEventListener("click",function(){
    LOCK.on=false; LOCK.master=null; LOCK.blob=null;
    save(); render(); say("The lock is off. This checklist is no longer scrambled.");
  });

  if(cp) cp.addEventListener("click",function(){
    var box=document.getElementById("lkForm");
    box.innerHTML='<h2>Change my PIN</h2><div class="field"><label for="np1">New PIN</label><input type="text" id="np1" inputmode="numeric" autocomplete="off"></div>'+

      '<div class="data-actions"><button class="btn" id="npGo">Use the new PIN</button></div>';

    document.getElementById("npGo").addEventListener("click",function(){
      var a=document.getElementById("np1").value.trim(), b=document.getElementById("np2").value.trim();
      if(a.length<6){ say("Please choose six numbers or more."); return; }
      if(a!==b){ say("The two PINs are not the same."); return; }
      changePin(a);
    });
  });
  var cq=document.getElementById("lkQs");
  if(cq) cq.addEventListener("click",function(){
    var box=document.getElementById("lkForm");
    box.innerHTML=questionsFormHTML(lockQuestions(LOCK.blob)[0])+'<div class="data-actions"><button class="btn" id="nqGo">Save this question</button></div>';
    wireQuestionPicker();
    document.getElementById("qSel").focus();
    document.getElementById("nqGo").addEventListener("click",function(){
      var f=readQuestionsForm();
      if(!f||!f.q){ say("Please write your own question, or pick one from the list."); return; }
      var bad=checkAnswer(f.answer); if(bad){ say(bad); return; }
      changeQuestions(f.q,f.answer);

function renderUnlock(){
  var b=LOCK.blob||{};
  var h='<div class="page" style="max-width:34rem"><h1>This checklist is locked</h1>';
  h+='<p class="lede">Please type your PIN to open it.</p>';
  h+='<div class="field"><label for="uk">PIN</label><input type="text" id="uk" inputmode="numeric" autocomplete="off"></div>';

    h+='<h2 style="margin-top:var(--s5)">Forgotten your PIN?</h2>';

    });

    h+='<p class="mini">This takes a few seconds. Please wait after you press it.</p>';

  document.getElementById("uOpenBtn").addEventListener("click",function(){ document.getElementById("uOpen").click(); });
  document.getElementById("uOpen").addEventListener("change",function(e){
    var f=e.target.files[0]; if(!f) return;

    r.onload=function(){
      LOCK.needUnlock=false; LOCK.on=false; LOCK.master=null; LOCK.blob=null;
      root=blankRoot(); state=root.projects[root.currentId];
      if(importData(r.result)) say("Your saved copy has been opened. The lock is now off.");
      else { LOCK.needUnlock=true; render(); }
    };
    r.readAsText(f);
  });
  document.getElementById("uWipe").addEventListener("click",function(){
    try{ if(store) store.removeItem(KEY); }catch(e){}
    delete mem[KEY];
    LOCK.needUnlock=false; LOCK.on=false; LOCK.master=null; LOCK.blob=null;
    root=blankRoot(); state=root.projects[root.currentId];

function tryOpen(which){
  var secret;
  if(which==="answers"){
    var ans=[],missing=false,n=lockQuestions(LOCK.blob).length||1;
    for(var i=0;i<n;i++){
      var f=document.getElementById("ua"+i), v=f?f.value:"";
      if(!normAnswer(v)) missing=true;
      ans.push(v);
    }
    if(missing){ say(n>1?"Please answer all the questions.":"Please type your answer first."); return; }
    secret=answersSecret(ans);
  } else {
    var el=document.getElementById("uk");
    secret=(el&&el.value||"").trim();
    if(!secret){ say("Please type your PIN first."); return; }
  }
  say(which==="answers"?"Checking your answer. This takes a few seconds. Please wait.":"Opening. Please wait a moment.");
  openRoot(LOCK.blob, secret, which).then(function(res){
    root=JSON.parse(res.text);
    var br=blankRoot(); for(var k in br) if(!(k in root)) root[k]=br[k];
    if(!root.projects[root.currentId]) root.currentId=root.order[0];
    state=root.projects[root.currentId];
    var bs=blankState(); for(var k2 in bs) if(!(k2 in state)) state[k2]=bs[k2];
    LOCK.master=res.master; LOCK.on=true; LOCK.needUnlock=false;
    render();
    say(which==="pin"?"Welcome back.":"Opened with your answer. Please set a new PIN now, on the Progress page.");
  }).catch(function(){
    say(which==="pin"?"That PIN did not work. Please try again.":
        "That answer did not work. Capital letters and extra spaces do not matter, but the words must be the same ones you typed when you set the lock.");
  });
}

/* ---------- moving to a new address, and keeping your own copy ----------
   The file carries the saved record exactly as this device holds it. If the
   lock is on, that record is the scrambled one, so locked work travels locked
   and is opened with the same PIN on the other side. Nothing is unscrambled to
   move it, and nothing readable is written to disk. */
function currentRecord(){
  var raw=(store&&store.getItem(KEY))||mem[KEY];
  return raw||JSON.stringify(root);
}
function moveFileText(){
  return JSON.stringify({ kind:MOVE_KIND, v:1, app:DOC_NAME, version:DOC_VERSION,
    saved:new Date().toISOString(), lockedWhenSaved:!!(LOCK.on||LOCK.needUnlock),
    key:KEY, record:currentRecord() }, null, 2);
}
function looksLikeMoveFile(d){ return !!(d&&typeof d==="object"&&d.kind===MOVE_KIND&&typeof d.record==="string"); }
function importMoveFile(d){
  var parsed=null;
  try{ parsed=JSON.parse(d.record); }catch(e){ say("That file could not be read."); return false; }
  if(parsed&&parsed.enc===true&&parsed.iv&&parsed.data){
    try{ if(store) store.setItem(KEY,d.record); else mem[KEY]=d.record; }catch(e){ mem[KEY]=d.record; }
    LOCK.blob=parsed; LOCK.needUnlock=true; LOCK.on=false; LOCK.master=null;
    render();
    say("Your work arrived, still locked. Please type your PIN to open it.");
    return true;
  }
  return importData(d.record);
}
function saveMoveFile(){
  downloadFile((state.project||"my-project").replace(/[^a-z0-9]+/gi,"-").toLowerCase()+"-move-my-work.json",
    moveFileText(),"application/json");
  say(LOCK.on?"Saved. Your work is still scrambled inside that file."
             :"Saved to your downloads. Keep it safe: it is not scrambled.");
}

function formatLastChecked(iso){
  if(!iso) return "";
  var d=new Date(iso); if(isNaN(d.getTime())) return "";
  var time;
  try{ time=d.toLocaleTimeString("en-GB",{ hour:"2-digit", minute:"2-digit", hour12:false }); }
  catch(e){ time=("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2); }
  var now=new Date();
  if(d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth() && d.getDate()===now.getDate()){
    return "today at "+time;
  }
  try{
    return d.toLocaleDateString("en-GB",{ day:"numeric", month:"long", year:"numeric" })+" at "+time;
  }catch(e2){
    return d.toISOString().slice(0,10)+" at "+time;
  }
}

function manualUpdateCheck(){
  if(PWA.checking) return;
  if(!PWA.reg){
    PWA.checkResult="unreachable";
    PWA.checking=false;
    refreshUpdatesPanel();
    say("The check could not be reached. Try again when you have a connection.");
    return;
  }
  PWA.checking=true;
  PWA.checkResult=null;
  refreshUpdatesPanel();
  PWA.reg.update().then(function(){
    PWA.checking=false;
    if(PWA.reg.waiting && navigator.serviceWorker.controller){
      PWA.waiting=PWA.reg.waiting; PWA.updateReady=true; PWA.checkResult="ready";
      PWA.sessionNewest=false;
      markUpdateChecked();
      paintUpdateBar();
      refreshUpdatesPanel();
      return;
    }
    if(PWA.reg.installing){
      PWA.checkResult="ready";
      markUpdateChecked();
      refreshUpdatesPanel();
      return;
    }
    PWA.checkResult="newest";
    PWA.sessionNewest=true;
    markUpdateChecked();
    refreshUpdatesPanel();
  }).catch(function(){
    PWA.checking=false;
    PWA.checkResult="unreachable";
    refreshUpdatesPanel();
  });
}

  h+=setRow("privacy","privacy","Privacy","What is kept, and what never leaves");
  h+=setRow("licence","licence","Licence","What you may do with this page");
  h+=setRow("notices","notices","Notices","No promises, and the rules of use");
  h+=setRow("contact","contact","Contact","How to get in touch");
  h+='</div></div>';
  return h;
}

function paintChrome(){
  var bb=document.getElementById("botbar");
  if(bb) bb.hidden = !!(typeof LOCK!=="undefined" && LOCK.needUnlock);
  var primary = (state.view==="route"||state.view==="prompts"||state.view==="glossary") ? "route"
    : (state.view==="data" || state.view==="move" || state.view==="lock") ? "data"
    : "settings";
  if(state.view==="data") primary="data";
  if(state.view==="settings"||state.view==="screen"||state.view==="textsize"||state.view==="updates"||state.view==="guide"||state.view==="about"||state.view==="changelog"||state.view==="licence"||state.view==="terms"||state.view==="privacy"||state.view==="notices"||state.view==="contact") primary="settings";
  if(state.view==="route"||state.view==="prompts"||state.view==="glossary") primary="route";
  document.querySelectorAll(".botbar [data-nav]").forEach(function(b){
    if(b.dataset.nav===primary) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current");
  });
  var back=document.getElementById("backBtn");
  var fwd=document.getElementById("fwdBtn");
  var onChecklist = state.setup && state.view==="route" && !state.q;
  if(back){
    var showBack = !onChecklist || (!!state.q);
    if(!state.setup) showBack=false;
    if(typeof LOCK!=="undefined" && LOCK.needUnlock) showBack=false;
    back.hidden=!showBack;
  }
  if(fwd){ fwd.hidden = !NAV_HISTORY.canForward; }
}
function goView(v, opts){
  opts=opts||{};
  stopSpeech();
  state.view=v;
  if(opts.keepQ!==true) state.q="";
  if(v!=="route") NAV_HISTORY.canForward=false;
  save(); render();
  if(opts.hash!==false) pushHash();
  window.scrollTo(0,0);
}
function render(){
  if(typeof LOCK!=="undefined" && LOCK.needUnlock){
    applySize(); applyTheme();
    modal.innerHTML="";
    renderUnlock();
    paintChrome();
    paintMovedBar();
    paintUpdateBar();
    return;
  }
  paintMovedBar();
  paintUpdateBar();
  applySize(); applyTheme();
  if(!state.setup){ modal.innerHTML=""; renderSetup(); paintChrome(); return; }
  if(state.view==="lock") renderLock();
  else if(state.view==="prompts") renderPrompts();
  else if(state.view==="glossary") renderGlossary();
  else if(state.view==="data") renderData();
  else if(state.view==="about"){ app.innerHTML=renderAbout(); wireOfficial(); }
  else if(state.view==="changelog"){ app.innerHTML=renderChangelog(); wireOfficial(); }
  else if(state.view==="install"){ app.innerHTML=renderInstall(); wireOfficial(); wireInstall(); }
  else if(state.view==="settings"){ app.innerHTML=renderSettings(); wireOfficial(); }
  else if(state.view==="screen"){ app.innerHTML=renderScreen(); wireOfficial(); wireScreen(); }
  else if(state.view==="textsize"){ app.innerHTML=renderTextSize(); wireOfficial(); wireTextSize(); }
  else if(state.view==="updates"){ app.innerHTML=renderUpdates(); wireOfficial(); wireUpdates(); }
  else if(state.view==="guide"){ app.innerHTML=renderGuide(); wireOfficial(); }
  else if(state.view==="contact"){ app.innerHTML=renderContact(); wireOfficial(); wireContact(); }
  else if(state.view==="move"){ app.innerHTML=renderMove(); wireOfficial(); wireMove(); }
  else if(state.view==="licence"){ app.innerHTML=paperPage("Licence","The full wording of the licence this page is given under.",licenceText(),"LICENCE.txt"); wireOfficial(); }
  else if(state.view==="terms"){ app.innerHTML=paperPage("Terms of use","The conditions of using this page, and what belongs to you.",termsText(),"TERMS.txt"); wireOfficial(); }
  else if(state.view==="privacy"){ app.innerHTML=paperPage("Privacy","What is kept, where it is kept, and what never leaves your device.",privacyText(),"PRIVACY.txt"); wireOfficial(); }
  else if(state.view==="notices"){ app.innerHTML=paperPage("Notices","No promises, acceptable use, and other people\u2019s code.",noticeFileText()+"\n\n"+acceptableUseText(),"NOTICE.txt"); wireOfficial(); }
  else renderRoute();
  paintChrome();
  paintMovedBar();
  paintUpdateBar();
  paintMeter();
}
/* ---------- real Back-button support via the address hash ---------- */
var applyingHash=false;
function currentHash(){
  if(!state.setup) return "#setup";
  if(state.view==="prompts") return "#prompts";
  if(state.view==="glossary") return "#words";
  if(state.view==="data") return "#progress";
  if(state.view==="settings") return "#settings";
  if(state.view==="route") return "#stage-"+(state.current+1);
  /* nested settings screens: keep a settings hash so Back does not jump mid-stage */
  if(["screen","textsize","updates","guide","about","changelog","licence","terms","privacy","notices","contact","move","lock"].indexOf(state.view)!==-1){
    return "#settings";
  }
  return "#stage-"+(state.current+1);
}
function pushHash(){
  if(applyingHash) return;
  var h=currentHash();
  if(location.hash!==h){ try{ location.hash=h; }catch(e){} }
}
function applyHashState(h){
  var m=/^#stage-(\d+)$/.exec(h||"");
  if(m && state.setup){ state.view="route"; state.q=""; state.current=Math.min(STAGES.length-1,Math.max(0,parseInt(m[1],10)-1)); }
  else if(h==="#prompts" && state.setup) state.view="prompts";
  else if(h==="#words" && state.setup) state.view="glossary";
  else if(h==="#progress" && state.setup) state.view="data";
  else if(h==="#settings" && state.setup){ if(["screen","textsize","updates","guide","about","changelog","licence","terms","privacy","notices","contact","move","lock","settings"].indexOf(state.view)===-1) state.view="settings"; }
  else if(h==="#setup" || h==="" || h==="#home" || h==="#checklist"){ if(state.setup){ state.view="route"; state.q=""; } }
}
window.addEventListener("hashchange",function(){
  if(applyingHash) return;
  applyingHash=true;
  applyHashState(location.hash||"");
  stopSpeech(); save(); render(); window.scrollTo(0,0);
  applyingHash=false;
});
function goHome(){
  goView("route");
}
(function wireChrome(){
  var back=document.getElementById("backBtn");
  if(back){
    back.innerHTML=ico("back");
    back.addEventListener("click",function(){
      NAV_HISTORY.canForward=true;
      if(history.length>1){ history.back(); } else { goHome(); }
    });
  }
  var fwd=document.getElementById("fwdBtn");
  if(fwd){
    fwd.innerHTML=ico("forward");
    fwd.addEventListener("click",function(){
      NAV_HISTORY.canForward=false;
      try{ history.forward(); }catch(e){}
    });
  }
  var bi=document.querySelector("#navChecklist .bi"); if(bi) bi.innerHTML=ico("checklist");
  bi=document.querySelector("#navProgress .bi"); if(bi) bi.innerHTML=ico("progress");
  bi=document.querySelector("#navSettings .bi"); if(bi) bi.innerHTML=ico("settings");
  document.querySelectorAll(".botbar [data-nav]").forEach(function(b){
    b.addEventListener("click",function(){
      var v=b.dataset.nav;
      if(v==="route"){ if(!state.setup){ state.view="route"; render(); } else goView("route"); }
      else if(v==="data") goView("data");
      else goView("settings");
    });
  });
})();
window.addEventListener("scroll",function(){
  var tb=document.getElementById("topbar");
  if(tb) tb.classList.toggle("scrolled", (window.scrollY||0)>2);
},{passive:true});

/* keep the sticky offset correct at any text size, window width or wrapped header */
function measureTop(){
  var tb=document.querySelector(".topbar");
  if(!tb) return;
  var h=Math.round(tb.getBoundingClientRect().height)||56;
  document.documentElement.style.setProperty("--topH", h+"px");
}
function measureBottom(){
  var bb=document.getElementById("botbar");
  if(!bb||bb.hidden){ document.documentElement.style.setProperty("--botH","0px"); return; }
  var h=Math.round(bb.getBoundingClientRect().height)||56;
  document.documentElement.style.setProperty("--botH", h+"px");
}
if(window.ResizeObserver){
  try{ new ResizeObserver(function(){ measureTop(); measureBottom(); }).observe(document.querySelector(".topbar")); }catch(e){}
  try{ var bb=document.getElementById("botbar"); if(bb) new ResizeObserver(measureBottom).observe(bb); }catch(e2){}
}
window.addEventListener("resize", function(){ measureTop(); measureBottom(); });
window.addEventListener("orientationchange", function(){ setTimeout(function(){ measureTop(); measureBottom(); },150); });

(function(){
  (function(){
    var v=document.getElementById("verLabel"); if(v) v.textContent=DOC_VERSION;
    var dt=document.getElementById("dateLabel"); if(dt) dt.textContent=DOC_DATE;
    var ow=document.getElementById("ownLabel"); if(ow) ow.textContent=DOC_OWNER;
  })();
  var el=document.getElementById("nowStamp");
  function stamp(){
    var d=new Date(), o={ weekday:"long", day:"numeric", month:"long", year:"numeric", hour:"2-digit", minute:"2-digit", hour12:false };
    try{ el.textContent=d.toLocaleString("en-GB",o); }catch(e){ el.textContent=d.toString(); }
  }
  stamp(); setInterval(stamp,30000);
})();
checkLocked();
/* honour a #stage-N link on first open, so bookmarks and shared links land in the right place */
if(location.hash && state.setup && !LOCK.needUnlock){ applyingHash=true; applyHashState(location.hash); save(); applyingHash=false; }
render();
try{ if(!location.hash) history.replaceState(null,"",location.pathname+location.search+currentHash()); }catch(e){}
measureTop(); measureBottom();
setTimeout(function(){ measureTop(); measureBottom(); },200);
if("serviceWorker" in navigator && /^https?:$/.test(location.protocol)){
  navigator.serviceWorker.register("/sw.js").then(function(reg){
    PWA.reg=reg;
    noteWaitingWorker(reg.waiting);
    reg.addEventListener("updatefound",function(){
      var nw=reg.installing; if(!nw) return;
      nw.addEventListener("statechange",function(){
        if(nw.state==="installed") noteWaitingWorker(nw);
      });
    });
    if(updateCheckOn()){
      reg.update().then(function(){
        if(reg.waiting && navigator.serviceWorker.controller){
          noteWaitingWorker(reg.waiting);
        } else if(!reg.installing){
          PWA.sessionNewest=true;
          PWA.checkResult="newest";
          markUpdateChecked();
          refreshUpdatesPanel();
        }
      }).catch(function(){});
    }
  }).catch(function(){});
  navigator.serviceWorker.addEventListener("controllerchange",function(){
    if(PWA.reloading) window.location.reload();
  });
}
</script>
