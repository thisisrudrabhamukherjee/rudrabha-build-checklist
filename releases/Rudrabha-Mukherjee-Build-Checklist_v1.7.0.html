<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#0F4F35" id="themeColorMeta">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<title>Rudrabha Mukherjee's Build Checklist — how to make software with AI, step by step</title>
<style>
:root, :root[data-theme="light"]{
  --ground:#EDEFF2; --surface:#FFFFFF; --sect:#F4F7F9;
  --ink:#101820; --muted:#3A4753; --quiet:#44525E;
  --rule:#B9C3CD; --rule-soft:#D6DDE3;
  --go:#0F4F35; --go-soft:#E2EFE8;
  --caution:#6B3D0A; --caution-soft:#FBF1E3;
  --danger:#8A2A12; --focus:#134E9E;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
  --topH:56px; --botH:56px; --maxw:720px;
  --r-ctrl:8px; --r-card:12px; --r-sheet:16px;
  --ease:cubic-bezier(0.2, 0, 0, 1);
  --fast:120ms; --base:180ms; --slow:260ms;
  --lift-1:0 1px 2px rgba(16,24,32,.06), 0 1px 3px rgba(16,24,32,.08);
  --lift-2:0 4px 12px rgba(16,24,32,.10);
  --lift-3:0 -4px 20px rgba(16,24,32,.12);
  --scrim:rgba(16,24,32,.42);
  --sans:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans","Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme]){
    --ground:#10161D; --surface:#1A232C; --sect:#212C37;
    --ink:#F2F6F9; --muted:#C9D3DC; --quiet:#B4C0CB;
    --rule:#4A5966; --rule-soft:#33404C;
    --go:#8FD8B2; --go-soft:#173226;
    --caution:#F2C283; --caution-soft:#33260F;
    --danger:#F09C86; --focus:#8AB8F2;
    --lift-1:0 1px 2px rgba(0,0,0,.35), 0 1px 3px rgba(0,0,0,.4);
    --lift-2:0 4px 12px rgba(0,0,0,.45);
    --lift-3:0 -4px 20px rgba(0,0,0,.5);
    --scrim:rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --ground:#10161D; --surface:#1A232C; --sect:#212C37;
  --ink:#F2F6F9; --muted:#C9D3DC; --quiet:#B4C0CB;
  --rule:#4A5966; --rule-soft:#33404C;
  --go:#8FD8B2; --go-soft:#173226;
  --caution:#F2C283; --caution-soft:#33260F;
  --danger:#F09C86; --focus:#8AB8F2;
  --lift-1:0 1px 2px rgba(0,0,0,.35), 0 1px 3px rgba(0,0,0,.4);
  --lift-2:0 4px 12px rgba(0,0,0,.45);
  --lift-3:0 -4px 20px rgba(0,0,0,.5);
  --scrim:rgba(0,0,0,.55);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme]) .btn{ background:#E9EEF3;border-color:#E9EEF3;color:#10161D }
  :root:not([data-theme]) .btn.ghost{ background:var(--surface);color:var(--ink);border-color:var(--rule) }
  :root:not([data-theme]) .btn.go{ background:#1E7A50;border-color:#1E7A50;color:#FFFFFF }
  :root:not([data-theme]) .btn.danger{ background:#B0402A;border-color:#B0402A;color:#FFFFFF }
  :root:not([data-theme]) .chip[aria-pressed="true"],
  :root:not([data-theme]) .sizer button[aria-pressed="true"]{ background:#E9EEF3;color:#10161D;border-color:#E9EEF3 }
  :root:not([data-theme]) .station.done .dot{ color:#10161D }
  :root:not([data-theme]) .check.on svg,:root:not([data-theme]) .opt[aria-pressed="true"] .box svg{ stroke:#10161D }
  :root:not([data-theme]) .check.on,:root:not([data-theme]) .opt[aria-pressed="true"] .box{ background:var(--go);border-color:var(--go) }
  :root:not([data-theme]) .status{ background:var(--go-soft);border-bottom-color:var(--go) }
  :root:not([data-theme]) .foot{ background:#0C1117 }
  :root:not([data-theme]) mark{ background:#8A6A14;color:#FFF }
  :root:not([data-theme]) .warn{ color:var(--caution) }
  :root:not([data-theme]) .botbar button[aria-current="page"]{ color:var(--ink) }
}
:root[data-theme="dark"] .btn{ background:#E9EEF3;border-color:#E9EEF3;color:#10161D }
:root[data-theme="dark"] .btn.ghost{ background:var(--surface);color:var(--ink);border-color:var(--rule) }
:root[data-theme="dark"] .btn.go{ background:#1E7A50;border-color:#1E7A50;color:#FFFFFF }
:root[data-theme="dark"] .btn.danger{ background:#B0402A;border-color:#B0402A;color:#FFFFFF }
:root[data-theme="dark"] .chip[aria-pressed="true"]{ background:#E9EEF3;color:#10161D;border-color:#E9EEF3 }
:root[data-theme="dark"] .sizer button[aria-pressed="true"]{ background:#E9EEF3;color:#10161D;border-color:#E9EEF3 }
:root[data-theme="dark"] .station.done .dot{ color:#10161D }
:root[data-theme="dark"] .check.on svg,:root[data-theme="dark"] .opt[aria-pressed="true"] .box svg{ stroke:#10161D }
:root[data-theme="dark"] .check.on,:root[data-theme="dark"] .opt[aria-pressed="true"] .box{ background:var(--go);border-color:var(--go) }
:root[data-theme="dark"] .status{ background:var(--go-soft);border-bottom-color:var(--go) }
:root[data-theme="dark"] .foot{ background:#0C1117 }
:root[data-theme="dark"] mark{ background:#8A6A14;color:#FFF }
:root[data-theme="dark"] .warn{ color:var(--caution) }
:root[data-theme="dark"] .botbar button[aria-current="page"]{ color:var(--ink) }
*{box-sizing:border-box}
html{font-size:18px;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;overflow-x:hidden;-webkit-tap-highlight-color:rgba(19,78,158,.18);background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:1rem;line-height:1.55;-webkit-font-smoothing:antialiased}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:3px}
button{font:inherit;color:inherit;touch-action:manipulation}
input,textarea,select{max-width:100%;touch-action:manipulation}
input[type=search]{-webkit-appearance:none;appearance:none}
.route>*,.item-row>*,.topbar-in>*,.sec-head>*{min-width:0}
h1,h2,h3{margin:0;font-weight:680;line-height:1.25}
p{margin:0 0 var(--s3)}p:last-child{margin-bottom:0}
mark{background:#FFE9A3;color:var(--ink);padding:0 .12em;border-radius:2px;font-weight:600}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:40;background:var(--ground);border-bottom:1px solid var(--rule);padding-top:env(safe-area-inset-top);transition:box-shadow var(--base) var(--ease);box-sizing:border-box}
.topbar.scrolled{box-shadow:var(--lift-1)}
.topbar-in{max-width:var(--maxw);margin:0 auto;height:55px;min-height:55px;max-height:55px;padding:0 max(var(--s3),env(safe-area-inset-left));display:flex;align-items:center;gap:var(--s2)}
.topbar-left,.topbar-right{display:flex;align-items:center;gap:var(--s1);flex:none;min-width:0}
.topbar-left{justify-content:flex-start}
.topbar-right{justify-content:flex-end;margin-left:auto}
.top-title{margin:0;flex:1 1 auto;min-width:0;text-align:center;font-size:15px;font-weight:700;line-height:1.2;color:var(--ink);white-space:nowrap;overflow:visible}
@media (max-width:320px){
  .top-title{font-size:13px;white-space:normal;line-height:1.15;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
  .topbar-in{height:auto;max-height:none;min-height:56px;padding-top:4px;padding-bottom:4px}
}
.iconbtn{flex:none;width:44px;height:44px;padding:0;border:0;background:transparent;border-radius:var(--r-ctrl);cursor:pointer;display:grid;place-items:center;color:var(--ink)}
.iconbtn svg{width:24px;height:24px}
.iconbtn[hidden]{display:none!important}
.saved{font-size:.82rem;color:var(--go);font-weight:640;border:2px solid transparent;border-radius:var(--r-ctrl);padding:2px 6px;white-space:nowrap;transition:background var(--base) var(--ease),border-color var(--base) var(--ease)}
.saved.flash{background:var(--go-soft);border-color:var(--go)}
.saved.warn{color:var(--caution);background:var(--caution-soft);border-color:var(--caution)}
.meter{display:flex;align-items:center;gap:var(--s2);margin:0 0 var(--s4)}
.meter-track{flex:1 1 auto;height:10px;background:var(--surface);border:1px solid var(--rule);border-radius:99px;overflow:hidden}
.meter-fill{height:100%;background:var(--go);width:0%;transition:width var(--slow) var(--ease)}
.meter-num{font-size:.94rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.sizer{display:flex;align-items:center;gap:var(--s1);flex-wrap:wrap}
.sizer .lab{font-size:.85rem;color:var(--quiet);margin-right:var(--s1)}
.sizer button{min-width:48px;min-height:48px;border:1px solid var(--rule);background:var(--surface);border-radius:var(--r-ctrl);cursor:pointer;font-weight:660}
.sizer button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}

/* ---------- bottom bar ---------- */
.botbar{position:fixed;left:0;right:0;bottom:0;z-index:45;width:100%;max-width:100%;background:var(--surface);border-top:1px solid var(--rule);box-shadow:var(--lift-3);padding-bottom:env(safe-area-inset-bottom);box-sizing:border-box;overflow:hidden}
.botbar[hidden]{display:none!important}
.botbar-in{max-width:var(--maxw);margin:0 auto;width:100%;height:55px;min-height:55px;display:flex;align-items:stretch;justify-content:space-around;padding:0;box-sizing:border-box}
.botbar button{flex:1 1 0;min-width:0;min-height:55px;max-width:none;border:0;background:transparent;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:4px 2px 6px;position:relative;font-size:.72rem;font-weight:560;border-radius:0}
.botbar button svg{width:24px;height:24px;flex:none}
.botbar button[aria-current="page"]{color:var(--ink);font-weight:700}
.botbar button[aria-current="page"]::after{content:"";position:absolute;left:20%;right:20%;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--go);transition:left var(--base) var(--ease),right var(--base) var(--ease)}
.botbar button:active{transform:scale(0.98);transition:transform var(--fast) var(--ease)}

/* ---------- settings groups ---------- */
.set-group{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-card);overflow:hidden;margin-bottom:var(--s4)}
.set-row{display:flex;align-items:center;gap:var(--s3);width:100%;min-height:56px;padding:10px var(--s4);border:0;border-bottom:1px solid var(--rule-soft);background:transparent;text-align:left;cursor:pointer;color:var(--ink)}
.set-row:last-child{border-bottom:0}
.set-row .si{flex:none;width:24px;height:24px;color:var(--muted);display:grid;place-items:center}
.set-row .si svg{width:24px;height:24px}
.set-row .st{flex:1;min-width:0}
.set-row .st .t{display:block;font-size:1.02rem;font-weight:620;line-height:1.3}
.set-row .st .d{display:block;font-size:.9rem;color:var(--muted);margin-top:2px;line-height:1.35}
.set-row .chev{flex:none;width:24px;height:24px;color:var(--quiet)}
.set-row:active{transform:scale(0.99);transition:transform var(--fast) var(--ease)}
.page.enter,.setup.enter,.route.enter{animation:riseIn var(--base) var(--ease)}
@keyframes riseIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.overlay{animation:fadeIn var(--base) var(--ease)}
.dialog{animation:dialogIn var(--base) var(--ease);box-shadow:var(--lift-2);border-radius:var(--r-sheet)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes dialogIn{from{opacity:0;transform:scale(0.98)}to{opacity:1;transform:none}}
#movedBar,#updateBar{animation:slideIn var(--base) var(--ease);box-shadow:var(--lift-1)}
@keyframes slideIn{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}
.btn:active{transform:scale(0.98);transition:transform var(--fast) var(--ease)}
.check.on svg,.opt[aria-pressed="true"] .box svg{animation:tickIn var(--fast) var(--ease)}
@keyframes tickIn{from{opacity:0;transform:scale(0.7)}to{opacity:1;transform:none}}

/* ---------- status message (replaces disappearing toasts) ---------- */
.status{background:var(--go-soft);border-bottom:2px solid var(--go)}
#movedBar,#updateBar{background:var(--caution-soft);border-bottom:3px solid var(--caution)}
#movedBar .in,#updateBar .in{max-width:var(--maxw);margin:0 auto;padding:var(--s4) max(var(--s4),env(safe-area-inset-left));
  display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap}
#movedBar p,#updateBar p{margin:0;flex:1 1 18rem;color:var(--caution);font-weight:620}
.about-name{font-size:1.12rem;font-weight:680;margin:0 0 var(--s2)}
.status-in{max-width:var(--maxw);margin:0 auto;padding:var(--s3) var(--s4);display:flex;align-items:center;gap:var(--s4)}
.status p{margin:0;font-size:1rem;color:var(--go);font-weight:600;flex:1}
.wrap{max-width:var(--maxw);margin:0 auto;padding:var(--s3) max(var(--s4),env(safe-area-inset-left)) calc(var(--s7) + var(--botH) + env(safe-area-inset-bottom))}
.status,#movedBar,#updateBar{position:relative;z-index:42}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 var(--s5);
  border:2px solid var(--ink);background:var(--ink);color:#fff;border-radius:4px;font-size:1rem;font-weight:620;cursor:pointer;text-align:center}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--rule)}
.btn.go{background:var(--go);border-color:var(--go)}
.btn.danger{background:var(--danger);border-color:var(--danger)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{min-height:48px;padding:0 var(--s4);font-size:.94rem;font-weight:580}

/* ---------- setup ---------- */
.setup{max-width:36rem;margin:0 auto}
.setup h1{font-size:1.9rem;margin-top:0;margin-bottom:var(--s3)}
.setup .lede{color:var(--muted);font-size:1.06rem;margin-bottom:var(--s6);max-width:60ch}
.lockhow{margin:0 0 var(--s4);padding-left:1.4em}
.lockhow li{margin-bottom:var(--s2)}
.field{margin-bottom:var(--s6)}
.field>label,.field>.lab{display:block;font-size:1.12rem;font-weight:680;margin-bottom:var(--s1)}
.hint{font-size:.98rem;color:var(--muted);margin-bottom:var(--s3);max-width:60ch}
input[type=text],input[type=search]{width:100%;min-height:52px;padding:var(--s3) var(--s3);font:inherit;font-size:1rem;border:2px solid var(--rule);border-radius:4px;background:var(--surface);color:var(--ink)}
select{width:100%;min-height:52px;padding:var(--s3);font:inherit;font-size:1rem;border:2px solid var(--rule);
  border-radius:4px;background:var(--surface);color:var(--ink);line-height:1.4;-webkit-appearance:menulist;appearance:menulist}
input[type=text]:focus,input[type=search]:focus{border-color:var(--focus)}
select:focus{border-color:var(--focus)}
.opts{display:grid;gap:var(--s2)}
.opt{display:flex;gap:var(--s3);align-items:flex-start;border:2px solid var(--rule);background:var(--surface);border-radius:4px;padding:var(--s3) var(--s4);cursor:pointer;text-align:left;width:100%;min-height:56px}
.opt[aria-pressed="true"]{border-color:var(--go);background:var(--go-soft)}
.opt .box{flex:none;width:28px;height:28px;margin-top:2px;border:2px solid var(--quiet);border-radius:4px;background:var(--surface);display:grid;place-items:center}
.opt[aria-pressed="true"] .box{border-color:var(--go);background:var(--go)}
.opt .box svg{display:none;width:18px;height:18px}
.opt[aria-pressed="true"] .box svg{display:block}
.opt .t{font-size:1.02rem;font-weight:620;display:block}
.opt .d{font-size:.94rem;color:var(--muted);display:block;margin-top:2px}
.writein{margin:var(--s2) 0 0 var(--s7)}

/* ---------- help panel ---------- */
.help{background:var(--surface);border:2px solid var(--rule);border-radius:4px;padding:var(--s4) var(--s5);margin-bottom:var(--s4)}
.help h2{font-size:1.24rem;margin-bottom:var(--s3)}
.help ol{margin:0 0 var(--s4);padding-left:1.4em}
.help li{margin-bottom:var(--s2);color:var(--muted)}
.help li b{color:var(--ink)}

/* ---------- route ---------- */
.route{display:grid;grid-template-columns:minmax(0,15rem) minmax(0,1fr);gap:var(--s6);align-items:start}
.spine{position:sticky;top:calc(var(--topH) + var(--s3));max-height:calc(100vh - var(--topH) - var(--s5));overflow-y:auto;overscroll-behavior:contain}
.spine h2{font-size:.95rem;color:var(--quiet);font-weight:620;margin-bottom:var(--s2)}
.spine ol{list-style:none;margin:0;padding:0}
.station{margin-bottom:2px}
.station button{display:flex;gap:var(--s3);align-items:center;width:100%;min-height:52px;text-align:left;
  background:none;border:2px solid transparent;border-radius:4px;padding:var(--s2) var(--s2);cursor:pointer;color:var(--muted)}
.dot{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid var(--rule);background:var(--surface);
  display:grid;place-items:center;font-size:.92rem;font-weight:700;color:var(--quiet);font-variant-numeric:tabular-nums}
.dot svg{display:none;width:17px;height:17px}
.station.done .dot{background:var(--go);border-color:var(--go);color:#fff}
.station.done .dot span{display:none}
.station.done .dot svg{display:block}
.station.here button{background:var(--surface);border-color:var(--go);color:var(--ink)}
.station.here:not(.done) .dot{border-color:var(--go);color:var(--go);border-width:3px}
.station.done.here .dot{border-width:3px}
.station .lbl{font-size:.98rem;line-height:1.3}
.station.here .lbl{font-weight:680}
.station .cnt{display:block;font-size:.85rem;color:var(--quiet);font-variant-numeric:tabular-nums}

.stage{background:var(--surface);border:2px solid var(--rule);border-radius:4px;overflow:hidden}
.stage-head{padding:var(--s5) var(--s5) var(--s4);border-bottom:2px solid var(--rule-soft)}
.stage-n{font-size:1rem;color:var(--muted);font-variant-numeric:tabular-nums;margin-bottom:var(--s2);font-weight:600}
.stage-head h1{font-size:1.72rem;margin-bottom:var(--s3)}
.stage-why{color:var(--muted);font-size:1.06rem;max-width:62ch}
.plain{margin:var(--s4) var(--s5) 0;padding:var(--s4);border:2px solid var(--rule-soft);border-left:6px solid var(--go);background:var(--sect);font-size:1rem;color:var(--muted);max-width:none}
.plain b{color:var(--ink);font-weight:680}

.toolbar{display:flex;gap:var(--s2);align-items:center;flex-wrap:wrap;padding:var(--s5) var(--s5) 0}
.toolbar .grow{flex:1 1 14rem;min-width:min(100%,12rem)}
.toolbar .tl{width:100%;font-size:.95rem;color:var(--quiet);margin-bottom:calc(var(--s1)*-1)}
.chips{display:flex;gap:var(--s1);flex-wrap:wrap}
.chip{background:var(--surface);border:2px solid var(--rule);border-radius:4px;min-height:48px;padding:0 var(--s4);font-size:.96rem;color:var(--muted);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:620}

.sections{padding:var(--s4) var(--s5) 0}
.sec{border:2px solid var(--rule-soft);border-radius:4px;margin-bottom:var(--s4);overflow:hidden}
.sec-head{display:flex;align-items:center;gap:var(--s3);width:100%;min-height:60px;background:var(--sect);border:0;
  border-bottom:2px solid transparent;padding:var(--s3) var(--s4);cursor:pointer;text-align:left}
.sec.open .sec-head{border-bottom-color:var(--rule-soft)}
.sec-head .nm{font-size:1.14rem;font-weight:660;margin-right:auto}
.sec-head .ct{font-size:.95rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.sec-head .tog{font-size:.94rem;color:var(--go);font-weight:620;white-space:nowrap;text-decoration:underline;text-underline-offset:3px}
.sec-body{display:none;padding:0 var(--s4) var(--s2)}
.sec.open .sec-body{display:block}

ul.items{list-style:none;margin:0;padding:0}
.item{border-top:2px solid var(--rule-soft);padding:var(--s4) 0}
.item:first-child{border-top:0}
.item-row{display:flex;gap:var(--s3);align-items:flex-start}
.check{flex:none;width:48px;height:48px;border:2px solid var(--quiet);border-radius:5px;background:var(--surface);
  cursor:pointer;display:grid;place-items:center;padding:0}
.check svg{display:none;width:26px;height:26px}
.check.on{background:var(--go);border-color:var(--go)}
.check.on svg{display:block}
.item-body{min-width:0;flex:1;padding-top:var(--s1)}

/* ============ RESPONSIVE BREAKPOINTS ============
   1400+  large desktop / wide monitor
   1100-  laptop
   1024-  tablet landscape, small laptop
    860-  tablet portrait  -> single column
    680-  large phone landscape / small tablet
    520-  phone portrait
    380-  small phone

   ============================================== */

@media (min-width:1400px){

}

@media (max-width:1100px){
  .route{ gap:var(--s5) }

  .plain,.gate,.notes{ margin-left:var(--s4);margin-right:var(--s4) }
}

/* single column: the stage list becomes a card of tiles above the content */
@media (max-width:1023px){
  .route{ grid-template-columns:1fr;gap:var(--s4) }
  .spine{ position:static;max-height:none;overflow:visible;background:var(--surface);
          border:2px solid var(--rule);border-radius:4px;padding:var(--s3) var(--s4) var(--s4) }

  .station button{ border-color:var(--rule-soft);background:var(--surface) }
  .plain,.gate,.notes{ margin-left:0;margin-right:0 }
  .stage-head,.plain,.toolbar,.sections,.gate,.notes{ padding-left:var(--s4);padding-right:var(--s4) }
}

@media (max-width:860px){
  .stage-head h1{ font-size:1.52rem }

}

@media (max-width:680px){
  .wrap{ padding-top:var(--s2) }

                      margin-left:calc(var(--s3) * -1);margin-right:calc(var(--s3) * -1) }
  .spine ol{ grid-template-columns:repeat(auto-fill,minmax(min(100%,9rem),1fr)) }
  .chips{ width:100% }
  .chip{ flex:1 1 auto }
  .gate-actions .btn,.data-actions .btn,.nav .btn{ flex:1 1 100% }
  .dialog .row .btn{ flex:1 1 100% }
}

@media (max-width:520px){
  .wrap{ padding-left:max(var(--s3),env(safe-area-inset-left));padding-right:max(var(--s3),env(safe-area-inset-right)) }
  .topbar-in{ padding-left:max(var(--s2),env(safe-area-inset-left));padding-right:max(var(--s2),env(safe-area-inset-right)) }
  .stage-head,.plain,.toolbar,.sections,.gate,.notes,.page,.help{ padding-left:var(--s3);padding-right:var(--s3) }
  .stage-head h1{ font-size:1.4rem }
  .page h1{ font-size:1.45rem }
  .spine ol{ grid-template-columns:1fr }
  .sizer .lab{ display:none }
  .sec-head{ flex-wrap:wrap;row-gap:var(--s1) }
  .sec-head .nm{ flex:1 1 100% }
  .sec-head .tog{ margin-left:auto }
  .prompt-head{ row-gap:var(--s2) }
  .prompt-head .pl{ flex:1 1 100% }
  .prompt-head .btn{ flex:1 1 100% }
  .itemtools .btn{ flex:1 1 100% }
  .score b{ font-size:1.7rem }
  .foot-in{ grid-template-columns:1fr;gap:var(--s3) }
}

@media (max-width:380px){
  :root{ --s5:20px; --s6:26px; --s7:38px }
  .sizer .lab{ display:none }
  .item-row{ gap:var(--s2) }
  .check{ width:44px;height:44px }
  .stage-head h1{ font-size:1.3rem }
  .btn{ padding:0 var(--s4) }
}

/* short screens: phone in landscape, small laptops, split-screen windows.
   Nothing is allowed to stick and eat the visible area. */
@media (max-height:560px){
  .spine{ position:static;max-height:none;overflow:visible }
}

/* coarse pointers get roomier rows regardless of screen width */
@media (pointer:coarse){
  .station button{ min-height:56px }
  .item{ padding-top:var(--s4);padding-bottom:var(--s4) }
}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{
  .topbar,.botbar,.spine,.nav,.gate-actions,.data-actions,.prompt-head,.toolbar,.addstep,.itemtools,.status,.help{display:none}
  body{background:#fff}.stage,.page{border:0}.route{display:block}.sec-body{display:block!important}
  .foot{background:#fff}
}

/* pointer devices only — stops sticky hover states on touch screens */
@media (hover:hover) and (pointer:fine){
.sizer button:hover{border-color:var(--ink)}
.iconbtn:hover{background:var(--sect)}
.set-row:hover{background:var(--sect)}
.botbar button:hover{color:var(--ink)}
.btn:hover{background:#000}
.btn.ghost:hover{border-color:var(--ink);background:var(--sect)}
.btn.go:hover{background:#0B3D28}
.btn.danger:hover{background:#6E210E}
.opt:hover{border-color:var(--ink)}
.station button:hover{background:var(--surface);border-color:var(--rule);color:var(--ink)}
.chip:hover{border-color:var(--ink);color:var(--ink)}
.check:hover{border-color:var(--go);background:var(--go-soft)}
.addstep:hover{border-color:var(--go);background:var(--go-soft)}
}

/* ================= 1 ================= */
{
id: "s1", name: "Decide what you're making",
why: "Everything after this depends on being clear about what the thing is and who it's for. An hour here saves weeks later.",
plain: "<b>In plain terms:</b> if you can't say out loud what it is, who uses it, and what they get, the AI will quietly invent its own answer. It will be wrong in ways you won't spot for a month.",
gate: "You can describe the whole thing in two sentences to someone who knows nothing about it, and they understand.",
sections: [
 { n: "Get the idea out of your head", items: [
  ["Write one sentence saying who it's for and what it does", "Format: it helps [who] to [do what] instead of [what they do now]. If you can't finish that sentence, you aren't ready to build."],

 ]},

 ]},
 { n: "The journeys", items: [
